faq:
  - frage: Ist ibis payment ein PSP oder ein Broker?
    antwort: |
      Weder noch im engen Sinn. ibis payment ist exklusiver Vertriebspartner der SwiPay AG. Wir verkaufen ein Angebot mit Terminal, Acquiring über TeleCash/Fiserv und Online-Zahlungen über Planet/Datatrans, und wir weisen in der Offerte aus, welche Anteile wohin gehen.
  - frage: Kostet mich ein Broker Geld?
    antwort: |
      Das hängt vom Modell ab. Bei Provision zahlt der Anbieter, und die Provision ist in dessen Marge enthalten. Bei Honorar zahlen Sie direkt. Fragen Sie, welches Modell gilt, und lassen Sie es in die Offerte schreiben.
  - frage: Brauche ich für ein Terminal einen PSP?
    antwort: |
      Nein, nicht als separaten Vertrag. Die technische Verbindung zwischen Terminal und Acquirer ist Teil des Angebots. Einen PSP als Gateway brauchen Sie für einen Online-Shop.
  - frage: Was bringt mir Payment Orchestrierung?
    antwort: |
      Für Online-Händler mit hohem Volumen in mehreren Ländern eine zweite Abwicklungsstrecke und die Wahl des jeweils günstigeren Wegs pro Zahlung. Für einen Betrieb mit Terminal am Verkaufspunkt bringt sie nichts und kostet eine zusätzliche Schicht.
  - frage: Woran erkenne ich einen transparenten Anbieter?
    antwort: |
      Er sagt, wer der Acquirer ist, wie er bezahlt wird, welche Positionen auf der Abrechnung erscheinen können und wie der Vertrag endet. Alles auf einer Seite, schriftlich, vor der Unterschrift.
