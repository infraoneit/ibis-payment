faq:
  - frage: Welches Zahlterminal passt zu meinem Betrieb?
    antwort: |
      Das hängt davon ab, wo bezahlt wird. Am Tisch oder am Stand ein mobiles Terminal, am Tresen ohne Kasse ein Tischterminal mit Drucker, an der Kasse ein kassenintegriertes Terminal. Wir schauen uns Ihren Ablauf vor Ort an und empfehlen ein Modell; wenn es nicht passt, tauschen wir es.
  - frage: Brauche ich ein Kassensystem für ein Zahlterminal?
    antwort: |
      Nein. Die mobilen Terminals und der V3CT3 funktionieren eigenständig, der Betrag wird am Terminal eingetippt. Haben Sie eine Kasse, binden wir das Terminal über OPI, ZVT oder KIT an, damit der Betrag nicht doppelt erfasst wird. Mehr dazu unter [Kassensysteme](/kassensysteme).
  - frage: Was ist der Unterschied zwischen Zahlterminal und Kartenlesegerät?
    antwort: |
      Im Alltag werden die Begriffe gleich verwendet. Als Kartenlesegerät werden oft kleine Leser bezeichnet, die an ein Handy gekoppelt werden. Ein Zahlterminal im Schweizer Sinn ist ep2-zertifiziert, läuft eigenständig und kann TWINT, PostFinance Card und die Kassenanbindung abwickeln.
  - frage: Funktioniert das Terminal ohne WLAN?
    antwort: |
      Die mobilen Modelle haben 4G eingebaut und brauchen kein WLAN. Fällt eines der beiden Netze aus, wechselt das Terminal automatisch auf das andere. Die stationären Modelle hängen am LAN oder WLAN; bei der Installation prüfen wir, ob die Verbindung an Ihrem Kassenplatz stabil ist.
  - frage: Wie schnell ist das Terminal einsatzbereit?
    antwort: |
      Die Offerte erhalten Sie innert 24 Stunden. Danach hängt der Termin von Ihrem bisherigen Vertrag ab; ohne Kündigungsfrist installieren wir innert weniger Tage nach Vertragsunterzeichnung [Lieferfrist bestätigen]. Die Installation vor Ort dauert in der Regel unter einer Stunde, inklusive Kassenanbindung und Testzahlung.
  - frage: Kann ich mein bestehendes Terminal weiterverwenden?
    antwort: |
      In Einzelfällen ja, wenn das Modell ep2-zertifiziert und für das SwiPay-Netzwerk freigegeben ist. Bei vielen älteren Terminals lohnt sich das wegen der Zulassungsfrage 2027 nicht. Schicken Sie uns Modell und Baujahr, und wir sagen Ihnen, ob es geht.
