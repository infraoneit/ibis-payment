faq:
  - frage: Welches Zahlterminal passt zu meinem Betrieb?
    antwort: |
      Das hängt davon ab, wo bezahlt wird. Am Tisch oder am Stand ein mobiles Terminal, am Tresen ohne Kasse ein Tischterminal mit Drucker, an der Kasse ein kassenintegriertes Terminal. Wir schauen uns Ihren Ablauf vor Ort an und empfehlen ein Modell.
  - frage: Brauche ich ein Kassensystem für ein Zahlterminal?
    antwort: |
      Nein. Die mobilen Terminals und der V3CT3 laufen eigenständig, der Betrag wird am Terminal eingetippt. Haben Sie eine Kasse, binden wir das Terminal über OPI, ZVT oder KIT an, damit der Betrag nicht doppelt erfasst wird. Mehr unter [Kassensysteme](/kassensysteme).
  - frage: Was ist der Unterschied zwischen Zahlterminal und Kartenlesegerät?
    antwort: |
      Im Alltag werden die Begriffe gleich verwendet. Als Kartenlesegerät werden oft kleine Leser bezeichnet, die an ein Handy gekoppelt werden. Ein Zahlterminal im Schweizer Sinn ist ep2-zertifiziert, läuft eigenständig und wickelt TWINT, PostFinance Card und die Kassenanbindung ab.
  - frage: Funktioniert das Terminal ohne WLAN?
    antwort: |
      Die mobilen Modelle haben 4G eingebaut und brauchen kein WLAN. Fällt eines der beiden Netze aus, wechselt das Terminal auf das andere. Die stationären Modelle hängen am LAN oder WLAN; bei der Installation prüfen wir die Verbindung an Ihrem Kassenplatz.
  - frage: Wie schnell ist das Terminal einsatzbereit?
    antwort: |
      Die Offerte erhalten Sie innert 24 Stunden. Danach hängt der Termin von Ihrem bisherigen Vertrag ab. Ohne Kündigungsfrist installieren wir kurz nach der Vertragsunterzeichnung [Lieferfrist eintragen].
  - frage: Kann ich mein bestehendes Terminal weiterverwenden?
    antwort: |
      In Einzelfällen, wenn das Modell ep2-zertifiziert und für das SwiPay-Netzwerk freigegeben ist. Bei vielen älteren Terminals lohnt es sich wegen der Zulassungsfrage ab 2027 nicht. Schicken Sie uns Modell und Baujahr, wir sagen Ihnen, ob es geht.
