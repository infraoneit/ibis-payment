kicker: Zahlterminal
lead: Ein Zahlterminal nimmt Debitkarten, Kreditkarten, TWINT und Handy-Wallets an einem Ort an. Hier steht, was ein Terminal in der Schweiz können muss, welche Bauform zu welchem Betrieb passt und was es kostet.
intro: |
  Wer in der Schweiz ein Zahlterminal sucht, findet viele Begriffe für dieselbe Sache: Kartenterminal, Kartenlesegerät, EFT/POS-Terminal, Bezahlterminal. Gemeint ist immer das Terminal, an dem Ihre Kundschaft mit Karte oder Handy bezahlt. Entscheidend ist nicht der Name, sondern drei Fragen: Welche Zahlungsmittel nimmt es an, wie ist es gebaut, und was kostet jede Zahlung.

  ibis payment vermittelt Terminals des Schweizer Herstellers PayTec aus Effretikon. Die Abwicklung läuft über das SwiPay-Bezahlnetzwerk mit TeleCash/Fiserv als Acquirer. Alle Gebühren stehen offen auf der Seite [Konditionen](/konditionen), und der Berater, der Ihnen die Offerte schreibt, installiert das Terminal auch vor Ort.

  Diese Seite ist der Einstieg. Für die Entscheidung zwischen Miete und Kauf, für den Anbietervergleich und für die einzelnen Modelle gibt es eigene Seiten, die unten verlinkt sind.
sections:
  - heading: Was ein Zahlterminal in der Schweiz können muss
    body: |
      Der Schweizer Markt hat eigene Anforderungen, die ein Terminal aus dem Ausland nicht automatisch erfüllt. Die wichtigste ist die ep2-Zertifizierung. ep2 ist der Schweizer Standard für den Datenaustausch zwischen Terminal und Acquirer; ohne ihn lassen sich PostFinance Card, Reka und Lunch-Check nicht abwickeln. Alle Terminals, die wir vermitteln, sind ep2-zertifiziert und erfüllen den Sicherheitsstandard PCI PTS 6.x.

      Die zweite Anforderung ist TWINT. In vielen Betrieben steht dafür ein QR-Aufsteller neben der Kasse, mit eigener Abrechnung und ohne Verbindung zum Terminal. Auf unseren Terminals wird TWINT direkt auf dem Display angezeigt. Der Betrag kommt vom Terminal, der Kunde scannt mit der TWINT-App, und die Zahlung erscheint auf derselben Abrechnung wie die Kartenzahlungen. Mehr dazu auf der Seite [TWINT Terminal](/twint-terminal).

      Drittens: kontaktlos. Karten und Handys mit Apple Pay, Google Pay oder Samsung Pay werden per NFC gelesen, Chipkarten über den Schlitz. Und viertens eine Verbindung, die hält. Die mobilen Modelle arbeiten mit 4G und WLAN und wechseln automatisch, wenn eines ausfällt. Die stationären Modelle hängen am LAN oder WLAN.
  - heading: Vier Bauformen, vier Einsatzorte
    body: |
      Welche Bauform passt, entscheidet der Ort, an dem bezahlt wird.

      - **Mobil**: Der Kunde bezahlt am Tisch, am Marktstand, an der Haustür. Der [PayTec N62](/geraete/paytec-n62) ist kompakt, 176 Gramm, ohne Drucker; der Beleg geht per QR-Code, SMS oder E-Mail raus. Der [PayTec N86](/geraete/paytec-n86) und der [PayTec N96](/geraete/paytec-n96) haben einen eingebauten Drucker und einen Akku für lange Schichten.
      - **Stationär ohne Kasse**: Der Betrag wird am Terminal eingetippt, der Beleg gedruckt. Der [PayTec V3CT3](/geraete/paytec-v3ct3) ist das klassische Tischterminal mit Tastatur und Drucker, auf Wunsch mit einem Kunden-Pinpad für die Theke.
      - **Kassenintegriert**: Die Kasse übergibt den Betrag ans Terminal, niemand tippt ihn ab. Der [PayTec CT20P](/geraete/paytec-ct20p) spricht die Schweizer Kassenprotokolle OPI, ZVT und KIT und hat ein physisches PIN-Pad.
      - **Automat**: Der [PayTec UN20](/geraete/paytec-un20) wird in Verkaufsautomaten, Parkanlagen und Ladestationen eingebaut und ist wetterfest. Der [PayTec N62 Vending](/geraete/paytec-n62-vending) ist die kompakte Variante für Automaten mit wenig Platz. Beide werden pro Projekt offeriert.

      Eine Übersicht aller Modelle mit technischen Daten finden Sie unter [Geräte](/geraete). Wenn Sie unsicher sind, welches Terminal zu Ihrem Ablauf passt, schauen wir es uns vor Ort an.
  - heading: Was ein Zahlterminal kostet
    body: |
      Ein Terminal verursacht zwei Arten von Kosten: den Preis für das Terminal selbst und die Gebühr pro Zahlung. Beide stehen bei uns offen auf der Seite [Konditionen](/konditionen), alle Preise exkl. MwSt.

      Das Terminal mieten Sie ab CHF 19 pro Monat, inklusive Wartung, Updates und Ersatzgerät, oder Sie kaufen es ab CHF 390 mit zwei Jahren Garantie. Aufschaltung und Einrichtung kosten CHF 0, die Installation vor Ort ist inbegriffen.

      Pro Zahlung fallen ein Prozentsatz je Kartenart und ein Fixbetrag von CHF 0.05 an: Debitkarten Inland 0.75 %, Kreditkarten Inland 1.25 %, TWINT 1.00 %, American Express 1.90 %, ausländische und Firmenkarten mit einem Zuschlag von 0.90 Prozentpunkten. Apple Pay und Google Pay werden zum Satz der hinterlegten Karte abgerechnet. Es gibt keine Mindestgebühr und keine Mindestlaufzeit.

      Die Beispielrechnung unten zeigt, was das für ein Restaurant bedeutet. Setzen Sie Ihre eigenen Zahlen ein; drei Angaben aus Ihrer letzten Abrechnung genügen.
  - heading: Vom ersten Gespräch bis zur ersten Zahlung
    body: |
      Der Ablauf ist in jedem Betrieb ähnlich und dauert in der Regel wenige Wochen, abhängig von der Kündigungsfrist beim bisherigen Anbieter.

      - Sie schicken uns Ihre letzte Monatsabrechnung oder nennen uns Umsatz, Durchschnittsbetrag und Kartenmix. Innert 24 Stunden erhalten Sie eine Offerte, in der jede Gebühr einzeln steht.
      - Haben Sie noch einen laufenden Vertrag, prüfen wir die Kündigungsfrist und übernehmen die Kündigung.
      - Ihr Berater konfiguriert das Terminal und kommt zur Installation vor Ort: Kassenanbindung, WLAN, Belegdesign, Testzahlung. Sie und Ihr Team sehen, wie Trinkgeld, Storno und Tagesabschluss funktionieren.
      - Ab der ersten Zahlung wird der Umsatz gesammelt pro Tag am nächsten Werktag auf Ihr Geschäftskonto gutgeschrieben. Einmal pro Monat erhalten Sie eine Abrechnung auf einer Seite.

      Der Berater, der installiert hat, bleibt Ihr Ansprechpartner mit Direktwahl. Den Start machen Sie über [Kontakt](/kontakt).
  - heading: Terminalwechsel 2027, was Sie jetzt prüfen sollten
    body: |
      Viele ältere Terminals verlieren voraussichtlich ab 2027 die Zulassung, weil die Kartenorganisationen neue Sicherheitsanforderungen stellen. Betroffen sind vor allem Modelle mit älteren PCI-Zertifizierungen. Ob Ihr Terminal dazugehört, sagen wir Ihnen anhand von Modell und Baujahr.

      Wenn ein Wechsel ansteht, ist das der richtige Moment, auch die Gebühren neu zu verhandeln. Wer nur das Terminal tauscht und den alten Vertrag weiterlaufen lässt, verpasst den grösseren Hebel. Die Seite [Zahlterminal Vergleich](/zahlterminal-vergleich) zeigt, worauf Sie beim Vergleich achten müssen.

      Alle Terminals, die wir vermitteln, erfüllen PCI PTS 6.x und sind ep2-zertifiziert. Bei der Miete sind Updates und Ersatzgerät enthalten, das Risiko einer späteren Nachrüstung liegt damit nicht bei Ihnen. Mehr dazu unter [Zahlterminal mieten](/zahlterminal-mieten) und [Zahlterminal kaufen](/zahlterminal-kaufen).
