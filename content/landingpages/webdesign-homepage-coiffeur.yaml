faq:
  - frage: Was kostet eine Website für einen Coiffeursalon?
    antwort: |
      Eine Website mit bis zu zehn Unterseiten, Preisliste als Text, Teamseite, Impressum und Datenschutzerklärung beginnt bei InfraOne pauschal bei [ab CHF 1'200] exkl. MwSt. Terminbuchung, Instagram-Einbindung und Gutscheinverkauf stehen als eigene Positionen in der Offerte.
  - frage: Ich habe schon ein Terminbuchungssystem. Kann es eingebunden werden?
    antwort: |
      In der Regel ja. Die meisten Systeme bieten einen Buchungslink oder ein Einbettungsmodul, das InfraOne auf der Website platziert. Nennen Sie im Formular den Namen des Systems, dann wird die Einbindung in der Offerte berücksichtigt.
  - frage: Kann ich Preise und Team selbst ändern?
    antwort: |
      Ja. Preisliste, Teamseite, Öffnungszeiten und Fotos pflegen Sie über eine Oberfläche ohne Programmierkenntnisse. Bei der Abnahme erhalten Sie eine Einführung dazu.
  - frage: Wie komme ich in die Google-Karte bei der lokalen Suche?
    antwort: |
      Über ein vollständig gepflegtes Google-Business-Profil mit Bewertungen, Fotos und aktuellen Öffnungszeiten, dessen Angaben mit der Website übereinstimmen. Eine Garantie für eine Platzierung gibt es nicht; die Grundlagen lassen sich aber beim Start richtig einrichten.
  - frage: Kann ich Gutscheine über die Website verkaufen?
    antwort: |
      Ja. Die Kundin wählt einen Betrag, bezahlt mit TWINT oder Karte und erhält den Gutschein per E-Mail. Die Zahlung läuft über Online-Zahlungen von ibis payment, die Gebühren stehen auf der Seite Konditionen.
