faq:
  - frage: Brauche ich im Salon ein Terminal mit Drucker?
    antwort: |
      In den meisten Fällen nicht. Der N62 zeigt den Beleg als QR-Code auf dem Display oder schickt ihn per SMS oder E-Mail. Wer trotzdem Papier will, nimmt den V3CT3 mit eingebautem Drucker zum gleichen Mietpreis.
  - frage: Kann die Kundin Trinkgeld über die Karte geben?
    antwort: |
      Ja. Das Terminal fragt vor der Bestätigung nach einem Trinkgeld, die Kundin wählt einen Betrag oder überspringt die Abfrage. Das Trinkgeld wird mit dem Umsatz gutgeschrieben und mit demselben Satz belastet wie der Grundbetrag.
  - frage: Was passiert, wenn das WLAN im Salon ausfällt?
    antwort: |
      Der N62 wechselt automatisch auf 4G und zahlt weiter. Der V3CT3 am Empfang hängt am LAN oder WLAN; wo die Verbindung unsicher ist, empfehlen wir das Kabel. Fällt das Terminal selbst aus, ist das Ersatzgerät in der Miete inbegriffen.
  - frage: Lohnt sich ein Terminal für einen Salon mit wenigen Kartenzahlungen?
    antwort: |
      Es gibt keine Mindestgebühr und keinen Mindestumsatz. Sie zahlen pro Zahlung den Prozentsatz plus CHF 0.05 und die Terminalmiete von CHF 19 pro Monat, exkl. MwSt. Wer wenig Umsatz hat, zahlt wenig.
  - frage: Kann ich TWINT am Terminal annehmen?
    antwort: |
      Ja, TWINT läuft direkt auf dem Terminal, ohne separaten QR-Aufsteller. Der Satz beträgt 1.00 % exkl. MwSt. und steht wie alle anderen Positionen auf der [Preisliste](/konditionen).
  - frage: Wie lange dauert der Wechsel vom bisherigen Anbieter?
    antwort: |
      Der Vergleich Ihrer Abrechnung dauert 24 Stunden. Danach prüfen wir die Kündigungsfrist Ihres heutigen Vertrags und installieren am Stichtag. Die Aufschaltung kostet CHF 0.
