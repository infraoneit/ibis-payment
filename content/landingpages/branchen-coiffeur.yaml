metaDescription: 'Zahlterminal für den Coiffeursalon: Trinkgeld auf dem Terminal, Beleg per QR-Code, Kartenzahlung ab 0.75 %. Monatlich kündbar, Installation inbegriffen.'
kicker: Branche
lead: Ein Terminal, das in die Schürze passt, Trinkgeld annimmt und ohne Papierrolle auskommt. Mit Gebühren, die vor der Unterschrift feststehen.
intro: |
  Im Coiffeursalon wird am Ende des Termins bezahlt, meist am Empfang, in kleinen Salons direkt am Stuhl. Die Beträge liegen im mittleren Bereich, und die Kundschaft zahlt mit dem, was gerade in der Hand ist: Debitkarte, Kreditkarte, TWINT oder das Handy. Wer nur Bargeld annimmt, schickt Kundschaft zum Bancomat und manchmal zum Salon nebenan.

  Für einen Salon zählen drei Dinge. Das Terminal darf nicht im Weg stehen. Trinkgeld muss ohne Münzen funktionieren. Und die Gebühren sollen auch an ruhigen Tagen tragbar sein, ohne Mindestumsatz und ohne Grundgebühr, die unabhängig vom Geschäft anfällt. Dazu kommt die Frage, ob die Terminsoftware den Betrag ans Terminal übergeben kann oder ob Sie ihn eintippen.

  Diese Seite zeigt, wie die Kartenzahlung im Salon abläuft, welches Terminal zu welcher Salongrösse passt und was auf der Abrechnung steht. Die vollständige Preisliste finden Sie unter [Konditionen](/konditionen), eine Offerte mit Ihren Zahlen erhalten Sie über [Kontakt](/kontakt).
sections:
  - heading: So läuft die Zahlung im Salon ab
    body: |
      Der Termin ist fertig, die Kundin kommt zum Empfang. Sie nennen den Betrag oder übernehmen ihn aus der Terminsoftware, tippen ihn ins Terminal und drehen das Display zur Kundin. Sie hält die Karte oder das Handy hin, bestätigt bei Bedarf ein Trinkgeld und gibt bei höheren Beträgen die PIN ein. Die Zahlung ist in wenigen Sekunden bestätigt.

      Den Beleg braucht im Salon fast niemand auf Papier. Der [PayTec N62](/geraete/paytec-n62) zeigt einen QR-Code auf dem Display, die Kundin scannt ihn und hat den Beleg auf dem Handy. Alternativ geht der Beleg per SMS oder E-Mail raus. Für Sie entfällt die Papierrolle, der Nachschub und der Rollenwechsel zwischen zwei Terminen.

      TWINT läuft direkt auf dem Terminal, ohne QR-Aufsteller am Tresen. Apple Pay und Google Pay werden wie die hinterlegte Karte behandelt und kosten denselben Satz wie diese Karte.
  - heading: N62 am Stuhl oder V3CT3 am Empfang
    body: |
      Für die meisten Salons passt der [PayTec N62](/geraete/paytec-n62). Er wiegt 176 Gramm, hat keinen Drucker, verbindet sich über WLAN oder 4G und schafft laut Datenblatt über 550 Zahlungen pro Akkuladung. Er liegt in der Schublade am Empfang oder steckt in der Schürzentasche, wenn Sie am Stuhl abrechnen. Miete CHF 19 pro Monat oder Kauf für CHF 390, exkl. MwSt.

      Wer einen fixen Empfang hat und einen gedruckten Beleg will, etwa weil die Kundschaft danach fragt, nimmt den [PayTec V3CT3](/geraete/paytec-v3ct3). Das ist ein Tischterminal mit Tastatur und eigenem Drucker, per LAN oder WLAN verbunden, zum gleichen Preis wie der N62.

      Die Faustregel: Ein Stuhl oder mobiler Service, dann N62. Fester Empfang mit Papierbeleg, dann V3CT3. Salons mit mehreren Stühlen und Stosszeiten am Samstag kombinieren beides, ein Terminal am Empfang und ein mobiles als zweite Linie. Jedes Terminal hat seine eigene Miete, eine Grundgebühr pro Betrieb gibt es nicht. Die Übersicht aller Modelle steht unter [Geräte](/geraete).
  - heading: Trinkgeld ohne Münzen
    body: |
      Trinkgeld ist im Salon üblich, und immer weniger Kundschaft hat Bargeld dabei. Das Terminal kann vor der Bestätigung nach einem Trinkgeld fragen, die Kundin wählt einen Betrag oder lehnt ab. Ob diese Abfrage aktiv ist, legen wir bei der Installation mit Ihnen fest. Sie können sie jederzeit ändern lassen.

      Das Trinkgeld läuft als Teil der Kartenzahlung mit, wird mit dem Umsatz gutgeschrieben und unterliegt derselben Gebühr wie der Grundbetrag. Im Händlerportal sehen Sie jede Transaktion einzeln, damit Sie das Trinkgeld am Monatsende dem Team zuordnen können. Wie Sie es verteilen und verbuchen, klären Sie am besten mit Ihrem Treuhänder.
  - heading: Terminsoftware anbinden oder Betrag eintippen
    body: |
      Viele Salons führen Termine und Preise in einer Software, die auch als Kasse dient. Unterstützt sie eines der Schweizer Kassenprotokolle OPI, ZVT oder KIT, übergibt sie den Betrag direkt ans Terminal. Niemand tippt ab, und der Tagesabschluss stimmt mit der Kartenabrechnung überein. Der N62 wird über KIT in der Cloud angebunden, der V3CT3 über KIT oder ZVT-LAN.

      Ob Ihre Software das kann, prüfen wir vor der Installation mit dem Softwareanbieter. Wenn nicht, bleibt das Eintippen, was bei einem Salon mit zwanzig Zahlungen am Tag kein Problem ist. Wer gleichzeitig über ein neues Kassensystem nachdenkt, findet unter [Kassensysteme](/kassensysteme) die Modelle, die wir anbinden und vor Ort einrichten.
  - heading: Samstag, Akku und Ausfall
    body: |
      Am Samstag sind mehrere Kundinnen gleichzeitig fertig. Ein zweites Terminal für CHF 19 pro Monat kostet weniger als ein Empfang, an dem drei Leute warten und der nächste Termin schon sitzt. Der Akku des N62 reicht nach Datenblatt für einen vollen Tag. Laden Sie ihn über Nacht, die Ladezeit beträgt 2.5 Stunden.

      Fällt das WLAN im Salon aus, wechselt der N62 selbständig auf 4G, die Kundin merkt nichts davon. Fällt das Terminal selbst aus, schicken wir ein Ersatzgerät; in der Miete ist das inbegriffen. Bei Fragen erreichen Sie Ihren Berater über die Direktwahl, also die Person, die das Terminal bei Ihnen installiert hat. Details unter [Support](/support).
  - heading: Abrechnung, Gutschrift und Wechsel
    body: |
      Die Kartenumsätze werden gesammelt pro Tag am nächsten Werktag auf Ihr Geschäftskonto gutgeschrieben. Einmal pro Monat erhalten Sie eine Abrechnung auf einer Seite, auf der jede Position steht: Debit Inland 0.75 %, Kredit Inland 1.25 %, TWINT 1.00 %, CHF 0.05 pro Zahlung, die Terminalmiete, alles exkl. MwSt. Keine Aufschaltgebühr, keine Mindestgebühr, monatlich kündbar.

      Die Beispielrechnung unten zeigt, was ein Salon mit den dort genannten Annahmen pro Monat zahlt, im Vergleich zum Listenpreis eines Grossanbieters. Setzen Sie Ihre eigenen Zahlen ein, die drei Angaben stehen auf Ihrer letzten Abrechnung.

      Wenn Sie heute schon ein Terminal haben, schicken Sie uns diese Abrechnung über [Kontakt](/kontakt). Wir rechnen innert 24 Stunden nach und unterbieten sie, oder wir sagen Ihnen, dass es nicht geht. Beim Wechsel prüfen wir die Kündigungsfrist Ihres heutigen Vertrags und installieren am Stichtag, damit kein Tag ohne Terminal bleibt. Alle Sätze stehen unter [Konditionen](/konditionen).
