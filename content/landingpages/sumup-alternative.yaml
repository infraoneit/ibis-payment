faq:
  - frage: Ab welchem Umsatz lohnt sich der Wechsel von SumUp?
    antwort: |
      Das hängt von Kartenmix und Durchschnittsbetrag ab. Setzen Sie Ihre Zahlen aus dem SumUp-Konto in den Rechner ein, oder schicken Sie uns die Umsatzübersicht. Wir rechnen innert 24 Stunden nach und sagen Ihnen auch, wenn es sich noch nicht lohnt.
  - frage: Geht TWINT bei SumUp auf dem Terminal?
    antwort: |
      Nach unserem Stand nicht, TWINT läuft dort über den QR-Aufsteller mit separatem Händlerkonto [Stand prüfen]. Auf den Terminals von ibis payment ist TWINT integriert und steht auf derselben Abrechnung wie die Karten.
  - frage: Muss ich bei ibis payment eine Laufzeit eingehen?
    antwort: |
      Nein. Miete und Acquiring-Vertrag sind monatlich kündbar, es gibt keine Mindestgebühr und keine Aufschaltgebühr. Wer nach einem Monat zurück will, kann das.
  - frage: Kann ich meinen SumUp-Leser weiter nutzen?
    antwort: |
      Als Reserve ja, er läuft unabhängig weiter. Für den Alltag ersetzt ihn das Terminal von PayTec, weil TWINT, PostFinance Card und die Kassenanbindung dort laufen. Zwei parallele Systeme bedeuten zwei Abrechnungen.
  - frage: Was ist der Unterschied zwischen einem SumUp-Leser und einem ep2-Terminal?
    antwort: |
      ep2 ist die Schweizer Zertifizierung für Terminals. Sie ermöglicht PostFinance Card, Reka, Lunch-Check, TWINT am Terminal und die Anbindung an Schweizer Kassensysteme über OPI, ZVT und KIT. Ein Leser ohne ep2 nimmt Karten und Wallets an, mehr nicht.
  - frage: Brauche ich für das Terminal ein Kassensystem?
    antwort: |
      Nein. Die mobilen Terminals und der V3CT3 laufen eigenständig, der Betrag wird am Terminal eingetippt. Eine Kasse lässt sich später anbinden, ohne das Terminal zu wechseln.
