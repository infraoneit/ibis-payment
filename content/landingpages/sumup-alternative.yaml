metaDescription: 'SumUp Alternative Schweiz: ab wann ein Terminal mit Vertrag günstiger ist als ein Leser ohne Abo, TWINT auf dem Terminal, Kassenanbindung, Berater vor Ort.'
kicker: Wechsel
lead: Ein Leser ohne Monatsgebühr ist für den Start oft die richtige Wahl. Ab einem gewissen Kartenumsatz wird ein Terminal mit Vertrag günstiger, und TWINT, Kassenanbindung und ep2 kommen dazu.
intro: |
  SumUp verrechnet nach eigener Preisliste [1.5 % Debit, 2.5 % Kredit, keine Monatsgebühr; Quelle und Datum eintragen], ohne Laufzeit und ohne Mindestgebühr. Wer einmal im Monat an einem Markt steht oder gerade gegründet hat, fährt damit gut.

  Mit dem Umsatz ändert sich die Rechnung. Ein Prozentsatz ohne Monatsgebühr ist bei kleinen Umsätzen günstig und bei grösseren teuer, weil jeder zusätzliche Franken denselben Satz kostet. Ein Terminal mit Vertrag hat eine Miete, dafür tiefere Sätze pro Kartenart. Dazwischen liegt der Punkt, an dem sich der Wechsel lohnt. Die Sätze von ibis payment stehen auf der Seite [Konditionen](/konditionen). Über SumUp machen wir nur Aussagen, die sich belegen lassen.
sections:
  - heading: Für wen SumUp passt
    body: |
      Das Modell passt zu Betrieben mit sehr kleinem oder unregelmässigem Kartenumsatz: ein Verein mit Festwirtschaft an zwei Wochenenden im Jahr, ein Nebenerwerb, ein Stand an einem einzelnen Markt. Wer in einem Monat keinen Umsatz hat, zahlt nichts. Diese Flexibilität kostet im Prozentsatz, und bei solchen Umsätzen ist das in Ordnung.

      Zwei Punkte sollten Sie kennen. TWINT am Terminal ist bei SumUp nicht verfügbar [Stand prüfen]; TWINT läuft dort über den QR-Aufsteller mit separatem Händlerkonto. Ob die Leser ep2-zertifiziert sind und PostFinance Card, Reka und Lunch-Check annehmen, prüfen Sie beim Anbieter [Stand prüfen]. Für einen Marktstand spielt das selten eine Rolle, für eine Bäckerei mit Stammkundschaft schon.
  - heading: Ab wann ein Terminal mit Vertrag günstiger wird
    body: |
      Die Rechnung hat zwei Seiten. Auf der einen die Terminalmiete von CHF 19 pro Monat, exkl. MwSt., die bei ibis payment unabhängig vom Umsatz anfällt. Auf der anderen die Differenz bei den Sätzen: Debitkarten Inland 0.75 % statt [1.5 %], Kreditkarten Inland 1.25 % statt [2.5 %], dazu CHF 0.05 pro Zahlung.

      Je höher der Kartenumsatz, desto grösser die Differenz bei den Sätzen, und desto schneller ist die Miete ausgeglichen. Wo der Punkt liegt, hängt von Kartenmix und Durchschnittsbetrag ab; bei vielen kleinen Zahlungen fällt der Fixbetrag stärker ins Gewicht als bei wenigen grossen.

      Die Beispielrechnung unten zeigt einen Coiffeursalon im Vergleich zum Listenpreis eines App-Anbieters. Setzen Sie Ihre Zahlen aus der SumUp-Übersicht ein: Kartenumsatz pro Monat, Anzahl Zahlungen, Anteil Kreditkarten.

      Eine Mindestgebühr gibt es bei ibis payment nicht. Die Miete ist der einzige Fixbetrag, und sie ist monatlich kündbar. Wer zurück will, kann das nach einem Monat.
  - heading: TWINT auf dem Terminal
    body: |
      Bei einem Aufsteller mit statischem QR-Code tippt der Kunde den Betrag selbst ein, Sie kontrollieren auf seinem Handy, und die Zahlung landet in einem separaten TWINT-Konto mit eigener Abrechnung.

      Auf den Terminals von PayTec, die wir vermitteln, ist TWINT integriert. Das Terminal zeigt den QR-Code mit dem Betrag, der Kunde scannt, die Bestätigung erscheint bei Ihnen. TWINT kostet 1.00 % plus CHF 0.05 pro Zahlung [Satz bestätigen] und steht auf derselben Monatsabrechnung wie die Karten. Mehr dazu auf der Seite [TWINT Terminal](/twint-terminal).

      Läuft TWINT bei Ihnen heute über den Aufsteller, fehlt dieser Umsatz in der SumUp-Übersicht. Rechnen Sie ihn beim Vergleich mit.
  - heading: Kassenanbindung, Support und ep2
    body: |
      **Kassenanbindung.** Wer eine Kasse hat, will den Betrag nicht zweimal eintippen. Die Terminals [PayTec CT20P](/geraete/paytec-ct20p), [PayTec N96](/geraete/paytec-n96) und [PayTec V3CT3](/geraete/paytec-v3ct3) sprechen die Kassenprotokolle OPI, ZVT oder KIT. Die Kasse übergibt den Betrag, das Terminal meldet die Zahlung zurück. Die Anbindung ist Teil der Installation vor Ort. Welche Kassensysteme wir kennen, steht unter [Kassensysteme](/kassensysteme).

      **Support.** Sie haben einen Berater mit Direktwahl, der das Terminal selbst installiert hat. Bei Defekt erhalten Sie ein Ersatzgerät, bei der Miete inbegriffen [Frist eintragen]. Für Betriebe mit Wochenendbetrieb gibt es eine Notfallnummer [Regelung eintragen].

      **ep2.** Der Schweizer Standard für Terminals. Er ist Voraussetzung für PostFinance Card, Reka und Lunch-Check und für die Anbindung an Schweizer Kassensysteme. Alle Terminals, die wir vermitteln, sind ep2-zertifiziert und erfüllen PCI PTS 6.x. Damit sind sie für den Terminalwechsel 2027 vorbereitet, bei dem viele ältere Terminals voraussichtlich die Zulassung verlieren.
  - heading: So wechseln Sie von SumUp
    body: |
      Der Wechsel ist einfacher als bei einem Vertrag mit Laufzeit, weil bei SumUp nichts gekündigt werden muss. Den Leser behalten Sie als Reserve oder geben ihn ab.

      - Schicken Sie uns die Umsatzübersicht der letzten Monate aus dem SumUp-Konto über [Kontakt](/kontakt). Wir rechnen innert 24 Stunden dieselben Umsätze mit unseren Sätzen nach.
      - Liegt unser Angebot nicht unter Ihren heutigen Kosten, sagen wir Ihnen das. Dann bleiben Sie bei SumUp, bis der Umsatz gewachsen ist.
      - Lohnt sich der Wechsel, wählen Sie Miete ab CHF 19 oder Kauf ab CHF 390 und das Modell. Für Betriebe, die vom SumUp-Leser kommen, ist der [PayTec N62](/geraete/paytec-n62) oft der nächste Schritt: ähnlich kompakt, ohne Drucker, Beleg per QR, SMS oder E-Mail, dazu TWINT, 4G und ep2.
      - Der Berater installiert vor Ort, bindet die Kasse an und macht eine Testzahlung. Aufschaltung CHF 0.

      Ab der ersten Zahlung erhalten Sie die Gutschrift gesammelt pro Tag am nächsten Werktag und einmal pro Monat eine Abrechnung auf einer Seite.
