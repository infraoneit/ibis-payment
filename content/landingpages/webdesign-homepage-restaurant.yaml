lead: 'Eine Restaurant-Website muss auf dem Handy drei Fragen beantworten: Was gibt es, wann ist offen, wie reserviere ich. Hier steht, wie die Website das leistet und was sie darüber hinaus für den Betrieb tun kann.'
intro: |
  Gäste suchen ein Restaurant auf dem Handy, oft unterwegs und mit wenig Geduld. Die Website muss die Speisekarte lesbar zeigen, die Reservation ohne Telefon ermöglichen und mit dem Google-Business-Profil übereinstimmen. Alles andere ist Zugabe.

  ibis payment vermittelt Restaurant-Websites an InfraOne IT Solutions GmbH in Winterthur ([infraone.ch](https://infraone.ch)). Das ist der IT-Partner, mit dem unsere Berater in Restaurants auch das Gäste-WLAN vom Kassennetz trennen und E-Mail einrichten. Wer das Terminal am Tisch und die Kasse kennt, baut die Website so, dass Reservation, Gutscheine und Online-Zahlung dazu passen.

  Auf dieser Seite steht, was eine Restaurant-Website braucht und welche Fehler Sie vermeiden können. Preisfaktoren und Ablauf finden Sie auf der Seite [Webdesign](/webdesign), die Checkliste für die Anfrage unter [Website erstellen lassen](/webdesign/website-erstellen-lassen).
sections:
  - heading: Speisekarte als Text, nicht als PDF
    body: |
      Ein häufiger Fehler auf Restaurant-Websites ist die Speisekarte als PDF. Auf dem Handy muss der Gast zoomen und schieben, für die Suche ist der Inhalt schlechter erfassbar als Text, und jede Änderung heisst: PDF neu erstellen, hochladen, alten Link ersetzen.

      Als Text auf der Seite ist die Karte auf jedem Bildschirm lesbar, und Sie ändern ein Gericht in wenigen Minuten über die Pflegeoberfläche. Allergene und vegetarische Kennzeichnung lassen sich als Symbole oder Kürzel hinterlegen. Die Tageskarte oder das Mittagsmenü bekommt einen eigenen Bereich, den Sie morgens anpassen.

      Wenn Sie die Karte zusätzlich als PDF zum Ausdrucken anbieten wollen, geht das. Die führende Version bleibt aber der Text auf der Seite. Wer eine Kasse mit Artikelstamm hat, kann prüfen, ob sich die Preise mit der Website abgleichen lassen; das hängt vom [Kassensystem](/kassensysteme) ab.
  - heading: Reservation ohne Telefon
    body: |
      Jeder Anruf während des Service kostet Zeit am Pass oder am Tisch. Eine Online-Reservation nimmt Anfragen entgegen, während Sie kochen. Es gibt zwei Stufen. Erstens ein Reservationsformular mit Datum, Uhrzeit, Personenzahl und Kontakt, das per E-Mail bei Ihnen ankommt und das Sie bestätigen. Zweitens ein Reservationssystem mit Tischplan, das freie Zeiten anzeigt und selbst bestätigt.

      Das Formular reicht für Betriebe mit wenigen Reservationen pro Tag, die die Kontrolle behalten wollen. Das System lohnt sich, wenn täglich viele Anfragen kommen oder wenn Sie Stosszeiten begrenzen wollen. Beides lässt sich einbauen; welches sinnvoll ist, klärt InfraOne mit Ihnen im Gespräch. In beiden Fällen muss die Reservation auf der Startseite sichtbar sein, auch auf dem Handy, und die Bestätigung an eine Adresse gehen, die während des Service gelesen wird.
  - heading: Öffnungszeiten und Google-Profil müssen übereinstimmen
    body: |
      Ein Gast, der vor verschlossener Tür steht, weil die Website Montag als offen zeigt und das Google-Profil nicht, kommt so schnell nicht wieder. Öffnungszeiten stehen auf der Website, im Google-Business-Profil, auf Instagram und oft noch auf Bewertungsportalen. Legen Sie fest, welcher Ort führend ist, und pflegen Sie Änderungen zuerst dort.

      Bei der Suche nach «Restaurant in der Nähe» zeigt Google die Karte mit den Profilen der Betriebe an. Name, Adresse und Telefonnummer im Profil müssen exakt mit der Website übereinstimmen. Fotos, die Speisekarte als Link auf die Website (nicht als PDF), der Reservationslink und Antworten auf Bewertungen gehören dazu. InfraOne richtet das Profil beim Start mit ein oder prüft ein bestehendes. Ob und wo Google den Betrieb anzeigt, entscheidet Google; eine Zusage dazu gibt es nicht.
  - heading: Fotos, die den Betrieb zeigen
    body: |
      Gäste entscheiden oft nach Bildern. Fotos vom Gastraum, von drei bis fünf Gerichten und vom Team sagen mehr als jede Beschreibung. Stockfotos erkennen Gäste und ziehen daraus den falschen Schluss. Handyfotos bei Tageslicht ohne Blitz reichen für den Anfang; bei dunklen Räumen oder für die Startseite lohnt sich ein Fototermin, der als eigene Position offeriert wird.

      Technisch wichtig: Bilder werden für die Website verkleinert, sonst lädt die Startseite im Mobilfunknetz langsam. Das übernimmt die Website automatisch, wenn sie richtig eingerichtet ist. Sie laden das Foto hoch, die Website erzeugt die passenden Grössen.
  - heading: Gutscheine online verkaufen
    body: |
      Viele Restaurants verkaufen Gutscheine nur an der Kasse. Auf der Website kann der Gast einen Gutschein mit Betrag wählen, mit TWINT, Karte oder PostFinance bezahlen und erhält ihn per E-Mail. Das läuft über [Online-Zahlungen](/online-zahlungen) von ibis payment, über dasselbe Gateway, das auch Shops nutzen. Die Gebühren stehen auf der Seite [Konditionen](/konditionen).

      Für Betriebe, die Anzahlungen für Gruppen oder Anlässe nehmen, funktioniert derselbe Weg: Betrag, Zahlung, Bestätigung. Das spart Rechnungen und Mahnungen. Ob der Gutscheinverkauf als eigene Seite oder als Button neben der Speisekarte eingebaut wird, legen Sie mit InfraOne im Gespräch fest.
  - heading: Mehrsprachig, wenn die Gäste es sind
    body: |
      Ob eine zweite Sprache sinnvoll ist, entscheidet die Gästestruktur, nicht der Standort. Ein Restaurant in einer Touristenregion oder in der Nähe von Firmen mit internationalem Personal profitiert von einer englischen Version der Speisekarte und der Reservation. Ein Quartierrestaurant braucht sie meistens nicht.

      Jede Sprache bedeutet doppelte Pflege: Wer die Tageskarte ändert, ändert sie in beiden Sprachen. Deshalb empfiehlt InfraOne, nur die Seiten zu übersetzen, die Gäste wirklich brauchen (Speisekarte, Reservation, Öffnungszeiten), und den Rest einsprachig zu lassen. Mehrsprachigkeit ist eine eigene Position in der Offerte. Fragen zum Zusammenspiel mit Terminal und Online-Zahlung beantworten wir über [Kontakt](/kontakt).
