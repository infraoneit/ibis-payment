faq:
  - frage: Was kostet eine Website für ein Restaurant?
    antwort: |
      Eine Website mit Speisekarte als Text, Reservationsformular, Impressum und Datenschutzerklärung kostet bei InfraOne pauschal ab CHF [1'200] exkl. MwSt. [Umfang und Preis mit InfraOne bestätigen]. Reservationssystem mit Tischplan, Gutscheinverkauf und Mehrsprachigkeit stehen als eigene Positionen in der Offerte.
  - frage: Kann ich die Speisekarte selbst ändern?
    antwort: |
      Ja. Gerichte, Preise und Tageskarte ändern Sie über eine Pflegeoberfläche, ohne Programmierkenntnisse. Das ist der Hauptgrund, die Karte als Text und nicht als PDF zu führen.
  - frage: Brauche ich ein Reservationssystem oder reicht ein Formular?
    antwort: |
      Für wenige Reservationen pro Tag reicht ein Formular, das Sie per E-Mail bestätigen. Ein System mit Tischplan lohnt sich bei vielen täglichen Anfragen oder wenn Sie Stosszeiten begrenzen wollen. InfraOne klärt das mit Ihnen anhand Ihrer Zahlen.
  - frage: Wie funktioniert der Gutscheinverkauf über die Website?
    antwort: |
      Der Gast wählt einen Betrag, bezahlt mit TWINT, Karte oder PostFinance und erhält den Gutschein per E-Mail. Die Zahlung läuft über Online-Zahlungen von ibis payment. Die Gebühren stehen auf der Seite Konditionen.
  - frage: Wer pflegt das Google-Business-Profil?
    antwort: |
      Sie, mit wenig Aufwand: neue Fotos einstellen, auf Bewertungen antworten, Feiertagszeiten eintragen. InfraOne richtet das Profil beim Start ein und verknüpft es mit der Website, damit Speisekarte und Reservation dort verlinkt sind.
