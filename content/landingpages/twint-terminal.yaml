faq:
  - frage: Funktioniert TWINT auf jedem Terminal von ibis payment?
    antwort: |
      Ja. TWINT ist auf allen PayTec-Terminals integriert, die wir vermitteln, mobil wie stationär. Der QR-Code wird auf dem Display angezeigt, der Betrag kommt vom Terminal oder von der Kasse.
  - frage: Was kostet TWINT für Händler?
    antwort: |
      1.00 % pro Zahlung plus CHF 0.05, exkl. MwSt. [Satz bestätigen]. Es gibt keine Aufschaltgebühr, keine Mindestgebühr und keinen separaten TWINT-Vertrag. Alle Sätze stehen auf der Seite [Konditionen](/konditionen).
  - frage: Kann ich den QR-Aufsteller behalten?
    antwort: |
      Ja, der Aufsteller funktioniert unabhängig vom Terminal weiter. Sie haben dann aber zwei Abrechnungen und zwei Gutschriften.
  - frage: Erscheint TWINT auf derselben Abrechnung wie die Karten?
    antwort: |
      Ja. TWINT wird auf der Monatsabrechnung als eigene Kartenart mit Umsatz, Anzahl Zahlungen und Gebühr ausgewiesen, auf derselben Seite wie Debit- und Kreditkarten. Die Gutschrift kommt gesammelt pro Tag.
  - frage: Geht TWINT auch mit dem Handy als Terminal?
    antwort: |
      Nein. Die App Softpay nimmt Visa, Mastercard, American Express, Apple Pay und Google Pay an, aber kein TWINT und keine PostFinance Card. Dafür braucht es ein ep2-zertifiziertes Terminal.
  - frage: Funktioniert TWINT auch im Webshop?
    antwort: |
      Ja, über das Gateway Planet/Datatrans mit Plugins für die gängigen Shopsysteme. Der Kunde wählt TWINT im Checkout und bestätigt in der App. Details unter [Online-Zahlungen](/online-zahlungen).
