metaDescription: 'Zahlterminal für die Gastronomie: Trinkgeld und Belegsplitting am Tisch, Kassenanbindung an der Bar, Debit ab 0.75 %. Monatlich kündbar.'
kicker: Branche
lead: Trinkgeld und geteilte Rechnung direkt am Tisch, die Bar an die Kasse angebunden, und eine Abrechnung, die zum Tagesabschluss passt.
intro: |
  Im Restaurant entscheidet sich die Zahlung am Tisch. Der Gast will nicht an die Theke, der Service will nicht zweimal laufen, und bei einer Vierergruppe will jeder seinen Teil zahlen. Dazu kommt das Trinkgeld, das bei Kartenzahlung nur funktioniert, wenn das Terminal danach fragt.

  Ein grosser Teil der Zahlungen fällt am Abend in kurzer Zeit an. Ein Terminal, das in dieser Zeit hängt, kostet Tische. Es muss schnell reagieren, einen Akku für den ganzen Service haben und mit der Kasse sprechen, damit niemand Beträge abtippt.

  Die Preisliste finden Sie unter [Konditionen](/konditionen), die Offerte mit Ihren Zahlen über [Kontakt](/kontakt).
sections:
  - heading: Zahlen am Tisch, nicht an der Theke
    body: |
      Der Gast verlangt die Rechnung, der Service bringt das Terminal mit. Ist die Kasse angebunden, kommt der Betrag von dort, sonst wird er eingetippt. Der Gast sieht den Betrag, beantwortet die Trinkgeldfrage, hält Karte oder Handy hin und gibt bei Bedarf die PIN ein. Der Beleg wird am Tisch gedruckt, beim N96 auf Wunsch mit Ihrem Logo.

      Für Gruppen gibt es das Belegsplitting: Der Service teilt die Rechnung auf dem Terminal in Teilbeträge, jeder Gast zahlt seinen Teil mit seiner Karte und erhält einen eigenen Beleg. TWINT läuft direkt auf dem Terminal, ebenso Reka und Lunch-Check.
  - heading: N96 am Tisch, CT20P an der Bar
    body: |
      Für den Service am Tisch empfehlen wir den [PayTec N96](/geraete/paytec-n96). Das 6.5-Zoll-Display ist gross genug für Trinkgeldeingabe und Belegsplitting, der Drucker schafft 80 Millimeter pro Sekunde, der Akku laut Datenblatt über 1500 Belege pro Ladung. 4G und WLAN sind eingebaut. Miete CHF 24 pro Monat, Kauf CHF 590, exkl. MwSt.

      Für Gartenwirtschaft und Festbetrieb, wo ein Terminal auch mal herunterfällt, ist der [PayTec N86](/geraete/paytec-n86) die robustere Wahl: mit Drucker, geprüft für Stürze aus 1.5 Metern auf Stein, zum gleichen Preis.

      An Bar und Theke steht der [PayTec CT20P](/geraete/paytec-ct20p). Er ist an die Kasse angebunden, hat ein physisches PIN-Pad für den Gast, druckt über den Kassendrucker und hängt am LAN, auf Wunsch mit Strom über das Netzwerkkabel. Miete CHF 24 pro Monat, Kauf CHF 590, exkl. MwSt.

      Faustregel: ein mobiles Terminal pro Servicebereich, dazu eines an der Bar. Jedes Terminal hat seine eigene Miete. Weil sie monatlich kündbar ist, passen Sie die Anzahl der Saison an.
  - heading: Kassenanbindung, damit der Abschluss stimmt
    body: |
      Ohne Kassenanbindung tippt der Service jeden Betrag ab. Im Stossbetrieb entstehen so Zahlendreher, die am Abend als Differenz zwischen Kasse und Terminal auftauchen und eine halbe Stunde Suche kosten.

      Mit Anbindung übergibt die Kasse den Betrag ans Terminal, und die Kartenzahlungen stehen im Tagesabschluss der Kasse. In der Schweiz laufen diese Anbindungen über die Protokolle OPI, ZVT oder KIT. N96 und CT20P unterstützen alle drei.

      Ob Ihre Kasse eines der Protokolle spricht, klären wir vor der Installation mit Ihrem Kassenanbieter. Die Installation vor Ort inklusive Kassenanbindung und WLAN ist im Preis inbegriffen. Wer die Kasse gleich mit erneuern will, findet unter [Kassensysteme](/kassensysteme) die Systeme, die wir mitbringen.
  - heading: Trinkgeld und geteilte Rechnungen
    body: |
      Das Terminal fragt den Gast vor der Bestätigung nach einem Trinkgeld [Trinkgeldfunktion und Einstellungen mit SwiPay bestätigen]. Das Trinkgeld ist Teil der Kartenzahlung, wird mit dem Umsatz gutgeschrieben und mit demselben Satz belastet wie der Grundbetrag. Für die Zuordnung ans Team brauchen Sie die Liste der einzelnen Zahlungen [Zugang zur Transaktionsübersicht bestätigen]; die Verbuchung klären Sie mit Ihrem Treuhänder.

      Beim Belegsplitting ist jede Teilzahlung eine eigene Zahlung. Der Fixbetrag von CHF 0.05 fällt deshalb pro Teilzahlung an, bei vier Gästen viermal. Das gilt bei jedem Anbieter, der einen Fixbetrag verrechnet. Wir nennen es hier, damit es auf der Abrechnung keine Überraschung gibt.
  - heading: Stosszeiten, Terrasse und Ausfall
    body: |
      Zwischen 19 und 21 Uhr darf nichts hängen. Die mobilen Terminals haben WLAN und 4G; reicht das WLAN auf der Terrasse oder im Gewölbekeller nicht, läuft die Zahlung über das Mobilfunknetz. Bei der Installation prüfen wir die Abdeckung und richten das WLAN bei Bedarf gleich mit ein.

      Legen Sie das Terminal nach jedem Service auf die Ladung, dann gibt es keine Diskussion. Als Reserve eignet sich ein [PayTec N62](/geraete/paytec-n62) für CHF 19 pro Monat, ohne Drucker, mit Beleg per QR-Code. Bei einem Defekt schicken wir ein Ersatzgerät, das ist in der Miete inbegriffen. Ihr Berater ist über die Direktwahl erreichbar, siehe [Support](/support).
  - heading: Abrechnung, Kartenmix und Wechsel
    body: |
      Restaurants sehen auf der Abrechnung oft viele Kreditkarten, und wer Touristen bedient, auch ausländische Karten. Dafür stehen getrennte Positionen: Debit Inland 0.75 %, Kredit Inland 1.25 %, TWINT 1.00 %, ausländische und Firmenkarten mit einem Zuschlag von 0.90 Prozentpunkten, American Express auf Wunsch 1.90 %, dazu CHF 0.05 pro Zahlung und die Terminalmiete, alles exkl. MwSt. Keine Aufschaltgebühr, keine Mindestgebühr.

      Die Gutschrift erfolgt gesammelt pro Tag am nächsten Werktag, was zum Tagesabschluss passt. Einmal pro Monat erhalten Sie die Abrechnung auf einer Seite. Die Beispielrechnung unten zeigt, was ein Restaurant mit den genannten Annahmen pro Monat zahlt, verglichen mit dem Listenpreis eines Grossanbieters.

      Für den Wechsel schicken Sie uns Ihre letzte Abrechnung über [Kontakt](/kontakt). Wir rechnen innert 24 Stunden nach und unterbieten sie, oder wir sagen Ihnen, dass es nicht geht. Die Installation legen wir ausserhalb der Servicezeiten auf den Stichtag Ihres alten Vertrags. Alle Sätze stehen unter [Konditionen](/konditionen).
