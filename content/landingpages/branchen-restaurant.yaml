faq:
  - frage: Wie viele Terminals braucht mein Restaurant?
    antwort: |
      Als Faustregel ein mobiles Terminal pro Servicebereich und eines an der Bar. Weil die Miete monatlich kündbar ist, können Sie für die Gartensaison ein Terminal dazunehmen und im Herbst wieder abgeben. Wir schauen uns den Betrieb vor der Offerte an.
  - frage: Funktioniert das Terminal auf der Terrasse ohne WLAN?
    antwort: |
      Ja. N96 und N86 wechseln automatisch auf 4G, sobald das WLAN nicht mehr reicht. Bei der Installation prüfen wir die Abdeckung und erweitern das WLAN, wenn es sinnvoll ist.
  - frage: Kann der Gast das Trinkgeld selbst eingeben?
    antwort: |
      Ja. Das Terminal fragt vor der Bestätigung nach, der Gast wählt einen Vorschlag, tippt einen Betrag ein oder überspringt die Frage. Das Trinkgeld ist im Händlerportal pro Zahlung sichtbar.
  - frage: Was kostet es, wenn eine Gruppe getrennt zahlt?
    antwort: |
      Jede Teilzahlung ist eine eigene Zahlung mit dem Prozentsatz der jeweiligen Karte plus CHF 0.05 Fixbetrag. Bei vier Teilzahlungen fällt der Fixbetrag viermal an. Die Prozentsätze bleiben gleich.
  - frage: Kann ich Reka und Lunch-Check annehmen?
    antwort: |
      Ja, alle Terminals nehmen Reka und Lunch-Check direkt an, ebenso TWINT, PostFinance Card, Apple Pay und Google Pay. Die Bedingungen für Reka und Lunch-Check weisen wir in der Offerte aus.
  - frage: Wie lange dauert der Wechsel?
    antwort: |
      Der Vergleich Ihrer Abrechnung dauert 24 Stunden. Danach prüfen wir die Kündigungsfrist Ihres heutigen Vertrags, übernehmen die Kündigung und installieren am Stichtag ausserhalb der Servicezeiten, inklusive Kassenanbindung.
