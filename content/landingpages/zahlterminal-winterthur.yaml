faq:
  - frage: Kommt der Berater nach Winterthur in den Betrieb?
    antwort: |
      Ja. Beratung, Installation, Kassenanbindung und Einweisung finden in Ihrem Betrieb statt. Der Berater, der installiert, bleibt danach Ihr Ansprechpartner mit Direktwahl.
  - frage: Welche Gemeinden rund um Winterthur werden bedient?
    antwort: |
      Die Stadt Winterthur und die Region, inklusive der umliegenden Gemeinden im Kanton Zürich und im angrenzenden Thurgau [Einzugsgebiet eintragen]. Ausserhalb davon installieren wir ebenfalls, die Anfahrt klären wir vorab.
  - frage: Sind die Konditionen in Winterthur anders als im Rest der Schweiz?
    antwort: |
      Nein. Die Sätze auf der Seite [Konditionen](/konditionen) gelten schweizweit. Was sich mit der Nähe ändert, ist der Service: Installation vor Ort, Ersatzgerät durch den Berater, kurze Wege bei Fragen.
  - frage: Was passiert, wenn das WLAN im Betrieb nicht reicht?
    antwort: |
      Die mobilen Terminals weichen automatisch auf 4G aus. Für stationäre Terminals und für Terrassen richtet unser Partner InfraOne in Winterthur WLAN und Netzwerk ein. Das klären wir bei der Installation, nicht danach.
  - frage: Wie schnell bekomme ich bei einem Defekt Ersatz?
    antwort: |
      Ein Ersatzgerät erhalten Sie bei der Miete ohne Zusatzkosten [Frist eintragen]. In Winterthur und Umgebung bringt es der Berater meist selbst vorbei [Reaktionszeit eintragen].
