title: 'Acquirer, Issuer, PSP: Die Rollen bei der Kartenzahlung'
pfad: /wissen/rollen-im-payment
cluster: wissen
navTitle: Rollen im Payment
metaTitle: 'Acquirer und Issuer: Rollen im Payment | ibis payment'
metaDescription: 'Acquirer, Issuer, Kartennetzwerk, PSP und Payment Broker erklärt: Aufgabe, Kostenanteil und wer bei Terminalausfall, Gutschrift oder Chargeback hilft.'
kicker: Wissen
lead: Zwischen der Karte des Kunden und dem Konto des Betriebs liegen mehrere Rollen. Wer sie kennt, weiss bei jedem Problem, wen er anrufen muss.
intro: |
  Eine Kartenzahlung dauert wenige Sekunden. In dieser Zeit sind mehrere Unternehmen beteiligt, die sich die Gebühr teilen und für unterschiedliche Dinge verantwortlich sind. Die Bank des Kunden prüft, ob Geld da ist. Das Kartennetzwerk leitet die Anfrage weiter. Der Acquirer zahlt an den Betrieb aus. Der Terminal-Anbieter liefert das Terminal, der Kassenanbieter die Software, die beide miteinander sprechen lässt.

  Für den Betrieb ist das unsichtbar, bis etwas nicht funktioniert. Dann stellt sich die Frage, wer zuständig ist: der Verkäufer des Terminals, die Hotline des Acquirers, der Kassenanbieter oder die eigene Bank. Wer die Rollen trennen kann, spart in diesem Moment Zeit.

  Die Konditionen finden Sie unter [Konditionen](/konditionen), Fragen beantworten wir über [Kontakt](/kontakt).
sections:
  - heading: 'Issuer und Kartennetzwerk: Autorisierung und Regeln'
    body: |
      Der Issuer ist die Bank des Kunden. Er gibt die Karte aus, führt das Konto und entscheidet bei jeder Zahlung innert Sekunden, ob sie autorisiert wird. Er trägt das Risiko, dass der Kunde nicht zahlt, und er ist die Stelle, bei der ein Karteninhaber eine Zahlung beanstandet. Sein Kostenanteil ist die Interchange-Gebühr; in der Schweiz legt die Wettbewerbskommission für Inlandkarten die Obergrenzen fest, etwa 0.12 % für Debit Mastercard am Verkaufspunkt und 0.44 % für Kreditkarten. Für den Betrieb ist der Issuer nie Ansprechpartner. Wird eine Karte abgelehnt, kann nur der Kunde bei seiner Bank nachfragen.

      Visa, Mastercard und American Express betreiben die Netzwerke, über die Autorisierung und Abrechnung laufen. Sie setzen die Regeln für alle Beteiligten: Sicherheitsanforderungen an Terminals, Fristen für Chargebacks, Haftung, Zulassungen. Dass viele ältere Terminals voraussichtlich ab 2027 die Zulassung verlieren, geht auf neue Sicherheitsanforderungen der Kartenorganisationen zurück. Ihr Kostenanteil ist die Netzwerk- oder Scheme-Gebühr. Der Betrieb hat mit dem Netzwerk keinen Vertrag und keinen Kontakt. TWINT ist ein eigenes System ausserhalb dieser Netzwerke, mit eigenen Regeln und eigener Gebühr.
  - heading: Der Acquirer wickelt ab, zahlt aus und trägt das Risiko
    body: |
      Der Acquirer ist der Vertragspartner des Betriebs für die Annahme von Karten. Er nimmt die Zahlung vom Terminal entgegen, holt die Autorisierung beim Issuer, rechnet mit den Netzwerken ab und zahlt den Betrag an den Betrieb aus. Er trägt das Risiko gegenüber dem Netzwerk, wenn ein Betrieb Zahlungen nicht liefert oder Chargebacks nicht bedient.

      Sein Kostenanteil ist die Acquiring-Marge, der einzige Teil der Gebühr, der zwischen Anbietern unterschiedlich ist. Für den Betrieb ist der Acquirer zuständig bei allem, was mit Geld zu tun hat: Gutschrift, Abrechnung, Chargeback, Gebührenhöhe. Im SwiPay-Bezahlnetzwerk ist das TeleCash/Fiserv.
  - heading: Terminal-Anbieter und Kassenanbieter liefern die Technik vor Ort
    body: |
      Der Terminal-Anbieter liefert, installiert und wartet das Terminal. In der Schweiz gilt dafür der Standard ep2; die Terminals von PayTec sind ep2-zertifiziert. Der Terminal-Anbieter ist zuständig, wenn das Terminal nicht startet, keine Verbindung hat, die Software veraltet ist oder ein Ersatzgerät gebraucht wird.

      Der Kassenanbieter liefert die Software, die Artikel, Tische und Beträge verwaltet. Die Verbindung zum Terminal läuft über ein Protokoll, in der Schweiz OPI, ZVT oder KIT. Kommt der Betrag nicht von der Kasse ans Terminal, liegt der Fehler auf dieser Schnittstelle, und beide Anbieter müssen zusammen hinschauen. Darum hilft es, wenn ein einziger Berater beide Seiten kennt und die Installation selbst gemacht hat.
  - heading: 'PSP und Payment Broker: Verbindung und Vermittlung'
    body: |
      Ein Payment Service Provider ist ein technischer Dienstleister. Er verbindet Terminals oder Online-Shops mit einem oder mehreren Acquirern, bündelt Zahlungsmethoden und stellt die Schnittstellen bereit. Im Online-Handel ist der PSP das Gateway, über das der Shop Kartenzahlungen, TWINT und PostFinance annimmt; bei uns ist das Planet/Datatrans mit über 40 Zahlungsmethoden und 14 Shop-Plugins. Der PSP ist zuständig, wenn eine Zahlungsmethode fehlt, die Schnittstelle Fehler meldet oder die Shop-Anbindung nicht funktioniert. Er zahlt nicht aus, das bleibt beim Acquirer.

      Ein Payment Broker betreibt keine eigene Plattform. Er kennt den Markt, ordnet Angebote ein, vermittelt den Betrieb an einen Acquirer oder PSP und begleitet die Einrichtung. Sein Kostenanteil ist eine Provision des Anbieters oder ein Teil der Marge; ob das transparent ist, zeigt sich daran, ob der Broker sagt, wie er bezahlt wird. Ein Broker ist nicht zuständig für Gutschriften oder Chargebacks, aber er leitet den Fall an die richtige Rolle weiter. Die Abgrenzung steht unter [PSP oder Payment Broker](/wissen/psp-oder-broker).
  - heading: Wer bei welchem Problem zuständig ist
    body: |
      Im Alltag hilft eine einfache Zuordnung:

      - Terminal startet nicht, hat keine Verbindung oder druckt nicht: Terminal-Anbieter. Bei uns der Berater über die Direktwahl, Ersatzgerät in der Miete inbegriffen.
      - Betrag kommt nicht von der Kasse ans Terminal: Schnittstelle zwischen Kasse und Terminal, Kassenanbieter und Terminal-Anbieter gemeinsam.
      - Gutschrift fehlt oder stimmt nicht mit dem Tagesabschluss überein: Acquirer. Ihr Berater prüft die Transaktionen, das Geld bewegt der Acquirer.
      - Chargeback, ein Kunde bestreitet eine Zahlung bei seiner Bank: Acquirer, mit Belegen des Betriebs. Der Issuer entscheidet nach den Netzwerkregeln.
      - Gebühr auf der Abrechnung stimmt nicht mit der Offerte überein: Acquirer beziehungsweise der Vertriebspartner, der die Offerte gestellt hat.
      - Karte wird abgelehnt, obwohl das Terminal funktioniert: Issuer. Der Kunde fragt bei seiner Bank nach, der Betrieb kann nichts tun.
      - Zahlungsmethode fehlt im Online-Shop: PSP. Fehlt sie am Terminal: Terminal-Anbieter.

      Wer das weiss, ruft beim ersten Mal die richtige Stelle an. Mehr dazu unter [Support](/support).
  - heading: Wo ibis payment in der Kette steht
    body: |
      ibis payment ist Vertriebspartner der SwiPay AG und damit der Berater, der Terminal, Kassenanbindung und Konditionen aus einer Hand liefert. Das Acquiring läuft über das SwiPay-Bezahlnetzwerk mit TeleCash/Fiserv als Acquirer; dort liegen Auszahlung und Risiko. Die Terminals kommen von PayTec und sind ep2-zertifiziert. Online-Zahlungen laufen über das Gateway Planet/Datatrans.

      Für den Betrieb heisst das: Ein Berater mit Direktwahl, der das Terminal selbst installiert hat, ist Ansprechpartner für alle Rollen. Er löst, was in seiner Rolle liegt, und leitet an Acquirer oder PSP weiter, was dort liegt. Die Gebühren sind in der Offerte nach Interchange, Netzwerkgebühr und Marge ausgewiesen, siehe [Konditionen](/konditionen). Wer wissen will, welches Modell zu seinem Betrieb passt, meldet sich über [Kontakt](/kontakt).
