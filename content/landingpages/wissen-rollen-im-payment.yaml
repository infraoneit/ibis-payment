faq:
  - frage: Was ist der Unterschied zwischen Acquirer und Issuer?
    antwort: |
      Der Issuer ist die Bank des Kunden, die die Karte ausgibt und die Zahlung autorisiert. Der Acquirer ist der Vertragspartner des Betriebs, der die Zahlung abwickelt, das Geld auszahlt und das Risiko trägt. Beide erhalten einen Teil der Gebühr: der Issuer die Interchange, der Acquirer die Marge.
  - frage: Wen rufe ich an, wenn die Gutschrift fehlt?
    antwort: |
      Den Acquirer, weil er das Geld bewegt. Bei uns rufen Sie Ihren Berater an, der die Transaktionen prüft und den Fall an den Acquirer TeleCash/Fiserv weiterleitet, wenn es dort liegt.
  - frage: Was passiert bei einem Chargeback?
    antwort: |
      Der Kunde bestreitet die Zahlung bei seinem Issuer. Der Acquirer fordert vom Betrieb Belege an, etwa den Zahlungsbeleg oder die Lieferbestätigung, und legt sie dem Issuer vor. Entschieden wird nach den Regeln des Kartennetzwerks. Bewahren Sie Belege deshalb auf.
  - frage: Braucht ein kleiner Betrieb überhaupt einen PSP?
    antwort: |
      Für Terminals am Verkaufspunkt nicht als separaten Vertrag, die technische Verbindung ist im Angebot enthalten. Für einen Online-Shop ja, dort ist der PSP das Gateway, das die Zahlungsmethoden bündelt. Bei uns ist das Planet/Datatrans.
  - frage: Ist ibis payment ein Acquirer?
    antwort: |
      Nein. ibis payment ist Vertriebspartner der SwiPay AG. Das Acquiring läuft über das SwiPay-Bezahlnetzwerk mit TeleCash/Fiserv als Acquirer. Für Sie ist der Berater von ibis payment die Anlaufstelle, der die Rollen dahinter kennt.
