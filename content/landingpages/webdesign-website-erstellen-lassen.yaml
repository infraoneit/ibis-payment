faq:
  - frage: Was kostet es, eine Website erstellen zu lassen?
    antwort: |
      Eine Website mit bis zu zehn Unterseiten, eigener Domain, Impressum und Datenschutzerklärung beginnt bei InfraOne pauschal bei [ab CHF 1'200] exkl. MwSt. Funktionen wie Reservation, Terminbuchung oder Online-Zahlung stehen als eigene Positionen in der Offerte. Laufende Kosten für Domain, Hosting und Pflege werden getrennt ausgewiesen.
  - frage: Muss ich die Texte selbst schreiben?
    antwort: |
      Nein, aber es ist günstiger und oft besser, weil Sie Ihren Betrieb am besten kennen. Wenn Sie keine Zeit haben, wird das Schreiben als Position offeriert. Ein Zwischenweg: Sie liefern Stichworte und bestehende Unterlagen, InfraOne formuliert daraus die Seiten.
  - frage: Kann ich die Website später selbst anpassen?
    antwort: |
      Ja. Öffnungszeiten, Preise, Texte und Fotos ändern Sie über eine Oberfläche ohne Programmierkenntnisse. Bei der Abnahme erhalten Sie eine Einführung. Grössere Änderungen an Aufbau oder Funktionen laufen über InfraOne.
  - frage: Was passiert mit meiner alten Website?
    antwort: |
      Bestehende Adressen werden auf die neuen Seiten umgeleitet, damit Besucher und Google keine Fehlerseiten sehen. Inhalte, die noch stimmen, werden übernommen. Das alte Hosting kündigen Sie erst, wenn die neue Website läuft.
  - frage: Brauche ich einen Pflegevertrag?
    antwort: |
      Nicht zwingend. Ohne Pflegevertrag werden Updates nach Aufwand verrechnet, wenn Sie sie bestellen. Ein Pflegevertrag lohnt sich, wenn Sie nicht selbst daran denken wollen; Sicherheitsupdates werden dann ohne Nachfrage eingespielt. Beide Varianten sind kündbar.
