kicker: Dienstleistung
lead: Buchhaltung, MwSt.-Abrechnung, Lohn und Jahresabschluss zu Pauschalen für Betriebe, deren Kasse und Kartenabrechnung der Treuhänder schon kennt. Vermittelt über ibis payment, geführt von [Treuhandpartner].
intro: |
  Ein Betrieb mit Kasse und Terminal erzeugt jeden Tag Belege: den Kassenabschluss, die Kartenzahlungen, TWINT, Trinkgeld, Bargeld. Beim klassischen Treuhänder landen diese Belege als Papierstapel oder als zehn verschiedene Dateien, und die Buchhaltung beginnt mit dem Abtippen. Das kostet Stunden, die Sie bezahlen, und erzeugt Fehler, die beim Jahresabschluss auffallen.

  ibis payment vermittelt die Buchhaltung an [Treuhandpartner], der die Kassensysteme und die Abrechnung aus unserem Netzwerk kennt. Kassenabschluss und Kartenabrechnung werden digital übernommen, nicht abgetippt. Die Preise sind Pauschalen, die vor dem Start festgelegt werden, nicht Stundenrechnungen am Ende des Monats.

  Diese Seite beschreibt, was der Treuhandpartner übernimmt, was Sie selbst liefern müssen und warum eine Abrechnung auf einer Seite für die Buchhaltung einen Unterschied macht. Die Übersicht aller Dienstleistungen finden Sie unter [Dienstleistungen](/dienstleistungen).
sections:
  - heading: Kassenabschluss und Kartenabrechnung direkt in die Buchhaltung
    body: |
      Der Tagesabschluss Ihrer Kasse enthält alles, was die Buchhaltung braucht: Umsatz nach MwSt.-Satz, Zahlungsarten (Bargeld, Karte, TWINT, Gutschein), Trinkgeld, Storni. Statt diesen Abschluss auszudrucken und abzulegen, wird er als Datei an den Treuhandpartner übermittelt, je nach [Kassensystem](/kassensysteme) automatisch oder als monatlicher Export.

      Die Kartenabrechnung von ibis payment kommt einmal pro Monat auf einer Seite: Umsatz pro Kartenart, Gebühren pro Kartenart, Fixgebühren, Terminalmiete, Gutschriften pro Tag. Der Treuhänder bucht daraus die Gebühren als Aufwand und gleicht die Gutschriften auf dem Bankkonto mit den Kassenabschlüssen ab. Weil Kartenumsatz, TWINT und Gebühren auf derselben Abrechnung stehen, entfällt das Zusammensuchen aus drei Portalen.

      Das Ergebnis: Die Buchhaltung ist am Monatsende abgeschlossen, nicht erst im Frühjahr. Sie sehen jeden Monat, wo der Betrieb steht.
  - heading: MwSt.-Abrechnung ohne Nachfragen
    body: |
      Die Mehrwertsteuer ist in der Gastronomie und im Detailhandel mit mehreren Sätzen verbunden: Normalsatz für Konsumation vor Ort, reduzierter Satz für Take-away und Lebensmittel, Sondersatz für Beherbergung. Die Kasse muss die Sätze richtig zuordnen, und die Buchhaltung muss sie aus dem Kassenabschluss übernehmen, ohne nachzurechnen.

      Der Treuhandpartner prüft beim Start, ob die Kasse die Sätze korrekt hinterlegt hat, und erstellt die MwSt.-Abrechnung quartalsweise oder halbjährlich, je nach Methode (effektiv oder Saldosteuersatz). Welche Methode für Ihren Betrieb günstiger ist, klärt er mit Ihnen im ersten Gespräch; die Wahl wirkt sich auf die Pauschale und auf den Aufwand aus. Die Abrechnung geht nach Ihrer Freigabe elektronisch an die Steuerverwaltung.
  - heading: Lohn und Sozialversicherungen
    body: |
      Die Lohnbuchhaltung umfasst Lohnabrechnungen pro Mitarbeitende, Abrechnung mit AHV-Ausgleichskasse, Unfallversicherung (UVG), Krankentaggeld (KTG) und Pensionskasse, Quellensteuer für ausländische Mitarbeitende sowie die Lohnausweise am Jahresende. In der Gastronomie kommen Stundenlöhne, Zuschläge und der Gesamtarbeitsvertrag (L-GAV) dazu, in Praxen und Salons Teilzeitpensen und Lehrlingslöhne.

      Sie melden monatlich die Stunden oder Änderungen, der Treuhandpartner erstellt die Abrechnungen und die Zahlungsdateien für Ihre Bank. Die Pauschale gilt pro Mitarbeitende und Monat, sodass die Kosten mit dem Team wachsen und schrumpfen. Für Fragen zu Versicherungen rund um Mitarbeitende, etwa UVG und KTG, ist der Prämien-Check unter [Versicherungen](/dienstleistungen/versicherungen) die passende Ergänzung.
  - heading: Jahresabschluss und Steuererklärung
    body: |
      Am Jahresende entstehen Bilanz, Erfolgsrechnung und die Steuererklärung der Firma. Wenn die Buchhaltung monatlich geführt wurde, ist der Abschluss eine Abrundung, keine Aufarbeitung: Abschreibungen auf Einrichtung und gekaufte Terminals, Abgrenzungen, Inventar, Rückstellungen. Bei Einzelfirmen gehört die Verbindung zur privaten Steuererklärung dazu, bei GmbH und AG die Vorbereitung der Generalversammlung.

      Der Treuhandpartner bespricht den Abschluss mit Ihnen, bevor er eingereicht wird. Sie sehen, wo Umsatz und Marge im Vergleich zum Vorjahr stehen, und was sich steuerlich auswirkt. Das ist auch der Moment, in dem sich Gebühren für Zahlungen, Miete und Dienstleistungen gesamthaft prüfen lassen; unsere [Konditionen](/konditionen) stehen offen, damit dieser Vergleich möglich ist. Alle Pauschalen verstehen sich exkl. MwSt.
  - heading: Was der Betrieb selbst liefern muss
    body: |
      Eine Pauschale funktioniert nur, wenn die Unterlagen vollständig und pünktlich kommen. Das müssen Sie liefern, in der Regel monatlich und digital:

      - **Kassenabschlüsse**, automatisch aus der Kasse oder als Export.
      - **Bankauszüge**, am besten als automatische Anbindung des Geschäftskontos an die Buchhaltungssoftware.
      - **Lieferantenrechnungen**, fotografiert oder als PDF, inklusive Barquittungen.
      - **Lohnangaben**, Stunden, Ein- und Austritte, Änderungen bei Pensum oder Adresse.
      - **Verträge**, die sich auf die Buchhaltung auswirken: Miete, Leasing, Kredite, Versicherungen.

      Die Kartenabrechnung von ibis payment müssen Sie nicht weiterleiten; sie geht mit Ihrer Zustimmung direkt an den Treuhandpartner. Beim Start legt er mit Ihnen fest, über welchen Weg die Unterlagen kommen (App, Ordner, E-Mail) und bis wann im Folgemonat. Wer die Belege laufend hochlädt, statt sie zu sammeln, braucht dafür wenige Minuten pro Woche.
  - heading: Warum eine Abrechnung auf einer Seite für die Buchhaltung zählt
    body: |
      Bei vielen Anbietern besteht die Kartenabrechnung aus mehreren Dokumenten: eine Abrechnung des Acquirers, eine Rechnung des Terminal-Anbieters, eine separate TWINT-Abrechnung, dazu Gutschriften mit Abzügen, die nicht einzeln ausgewiesen sind. Der Treuhänder muss diese Dokumente zusammenführen und die Gebühren aus der Differenz zwischen Umsatz und Gutschrift herleiten. Das kostet Zeit, und die Gebühren verschwinden in einer Sammelposition.

      Die Abrechnung von ibis payment ist eine Seite mit allen Positionen: Umsatz, Gebühren pro Kartenart, Fixbetrag, Miete, Gutschriften. Der Treuhänder bucht jede Position auf das passende Konto, und Sie sehen in der Erfolgsrechnung, was Kartenzahlungen Ihren Betrieb tatsächlich kosten. Diese Zahl ist die Grundlage, um Gebühren zu vergleichen, und sie ist der Grund, warum wir die Abrechnung so bauen. Wenn Sie zuerst wissen wollen, ob der Treuhandpartner zu Ihrem Betrieb passt, sprechen Sie mit Ihrem Berater über [Kontakt](/kontakt). Er stellt den Kontakt her und gibt die Angaben zu Kasse und Abrechnung mit.
