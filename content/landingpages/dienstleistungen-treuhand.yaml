faq:
  - frage: Wovon hängt die Pauschale für die Buchhaltung ab?
    antwort: |
      Von der Anzahl Buchungen pro Monat, der Anzahl Bankkonten, der MwSt.-Methode und davon, ob die Belege digital und laufend kommen. Der Treuhandpartner nennt die Pauschale nach einem ersten Gespräch, in dem er Ihre Kasse und Ihre Unterlagen anschaut.
  - frage: Muss ich meine Buchhaltungssoftware wechseln?
    antwort: |
      Nicht zwingend. Wenn Ihre Software einen Export für Kassenabschlüsse und eine Bankanbindung hat, kann der Treuhandpartner damit arbeiten. Wo das nicht der Fall ist, schlägt er eine Software vor, in die Sie Belege per App hochladen.
  - frage: Bekommt der Treuhänder meine Kartenabrechnung automatisch?
    antwort: |
      Ja, wenn Sie das wünschen. Mit Ihrer Zustimmung geht die monatliche Abrechnung von ibis payment direkt an den Treuhandpartner. Sie erhalten sie weiterhin selbst.
  - frage: Kann ich nur den Jahresabschluss machen lassen und die Buchhaltung selbst führen?
    antwort: |
      Ja. Die Pauschale für den Jahresabschluss gilt auch, wenn Sie die laufende Buchhaltung selbst führen. Der Treuhandpartner prüft dann die Buchhaltung vor dem Abschluss; der Aufwand dafür hängt von der Qualität der Unterlagen ab und wird vorher genannt.
  - frage: Wie schnell ist der Monatsabschluss fertig?
    antwort: |
      Das hängt davon ab, wann Ihre Unterlagen vollständig sind. Der Termin wird beim Start festgelegt, etwa bis zu einem bestimmten Tag im Folgemonat. Wer Belege laufend hochlädt, hat den Abschluss in der Regel in der ersten Monatshälfte.
