faq:
  - frage: Was kostet der Prämien-Check?
    antwort: |
      Nichts. Der Broker wird über die Courtage der Versicherungsgesellschaft bezahlt, die in jeder Prämie eingerechnet ist. Ob Sie nach dem Check etwas ändern, entscheiden Sie; es gibt keine Verpflichtung.
  - frage: Muss ich meine Versicherung wechseln?
    antwort: |
      Nein. Wenn Ihre heutige Police passt, bleibt sie. Der Broker zeigt Ihnen Lücken, Doppelungen und Vergleichsangebote; die Entscheidung liegt bei Ihnen. Oft ist eine Anpassung bei der bestehenden Gesellschaft sinnvoller als ein Wechsel.
  - frage: Welche Unterlagen brauche ich für den Check?
    antwort: |
      Für die Anfrage nur Branche, Anzahl Mitarbeitende und Kontakt. Für die Prüfung selbst die bestehenden Policen oder die letzten Prämienrechnungen. Der Broker sagt Ihnen im ersten Gespräch, was er genau braucht.
  - frage: Wie unabhängig ist der Broker?
    antwort: |
      Er ist an keine Versicherungsgesellschaft gebunden und vergleicht mehrere Anbieter. Auf Anfrage legt er offen, welche Courtage er von welcher Gesellschaft erhält. Name und Zulassung des Brokers stehen in der Offerte [Versicherungsbroker, unabhängig].
  - frage: Ist das gemietete Terminal versichert?
    antwort: |
      Bei der Miete über ibis payment sind Wartung und Ersatzgerät bei Defekt enthalten. Diebstahl oder Beschädigung durch Feuer oder Wasser fallen unter Ihre Sachversicherung; der Broker prüft, ob Terminal und Kasse im Inventar enthalten sind.
  - frage: Brauche ich eine Cyber-Versicherung?
    antwort: |
      Das hängt davon ab, welche Daten Sie speichern und wie abhängig Ihr Betrieb von Kasse, Reservation und Online-Zahlungen ist. Ein Betrieb, der ohne Kasse nicht arbeiten kann, hat ein anderes Risiko als ein Marktstand. Der Broker beurteilt das anhand Ihres Setups.
