lead: Die meisten Betriebe haben ihre Versicherungen seit Jahren nicht mehr angeschaut. Ein unabhängiger Broker prüft Ihre Policen und Prämien, kostenlos und ohne Verpflichtung. Drei Angaben, Rückmeldung innert zwei Werktagen.
intro: |
  Versicherungen werden bei der Gründung abgeschlossen und danach selten geprüft. Der Betrieb wächst, die Mitarbeiterzahl ändert sich, neue Risiken kommen dazu (Online-Zahlungen, Kundendaten, Lieferdienste), und die Policen bleiben, wie sie waren. Das führt in beide Richtungen zu Fehlern: zu viel Prämie für Risiken, die nicht mehr bestehen, und Lücken bei Risiken, die neu sind.

  ibis payment vermittelt den Prämien-Check an [Versicherungsbroker, unabhängig]. Unabhängig heisst: Der Broker ist an keine Versicherungsgesellschaft gebunden und vergleicht die Angebote mehrerer Anbieter. Sie bleiben bei Ihrer Versicherung, wenn sie passt, oder wechseln, wenn ein anderes Angebot besser ist. Der Check kostet nichts und verpflichtet zu nichts.

  Diese Seite erklärt, welche Versicherungen ein Betrieb braucht, wie der Broker bezahlt wird und wie der Check abläuft. Die Übersicht aller Dienstleistungen finden Sie unter [Dienstleistungen](/dienstleistungen).
sections:
  - heading: Welche Versicherungen ein Betrieb braucht
    body: |
      Nicht jeder Betrieb braucht jede Police. Die folgende Liste zeigt, worum es bei den einzelnen Versicherungen geht, damit Sie Ihre eigenen Policen einordnen können.

      - **Betriebshaftpflicht.** Deckt Schäden, die Ihr Betrieb Dritten zufügt, etwa ein Gast rutscht aus, ein Kunde wird bei der Behandlung verletzt, eine Ware beschädigt fremdes Eigentum.
      - **Sachversicherung.** Deckt Einrichtung, Waren, Geräte und Kasse gegen Feuer, Wasser, Einbruch und Diebstahl; auch das gemietete Terminal und die Kasse gehören zum Inventar.
      - **Betriebsunterbruch.** Ersetzt den laufenden Ertrag, wenn der Betrieb nach einem versicherten Schaden schliessen muss, zum Beispiel nach einem Wasserschaden in der Küche.
      - **Cyber.** Deckt Kosten nach einem Angriff auf IT oder Daten, etwa Wiederherstellung, Meldepflichten, Betriebsausfall nach einem Verschlüsselungsangriff auf die Kasse.
      - **Unfallversicherung (UVG).** Gesetzlich vorgeschrieben für alle Mitarbeitenden, deckt Berufs- und je nach Pensum Nichtberufsunfälle.
      - **Krankentaggeld (KTG).** Freiwillig, aber üblich: zahlt den Lohn weiter, wenn Mitarbeitende längere Zeit krank sind, und schützt den Betrieb vor der gesetzlichen Lohnfortzahlung aus eigener Tasche.
      - **Rechtsschutz.** Übernimmt Anwalts- und Gerichtskosten bei Streit mit Lieferanten, Vermietern, Mitarbeitenden oder Kunden.

      Welche davon für Ihren Betrieb nötig sind und in welcher Höhe, hängt von Branche, Grösse und Mietverhältnis ab. Das ist die erste Frage, die der Broker beim Check klärt.
  - heading: Warum ein Prämien-Check alle paar Jahre sinnvoll ist
    body: |
      Versicherungen ändern ihre Tarife, neue Anbieter kommen auf den Markt, und Ihr Betrieb verändert sich. Eine Police, die bei der Gründung mit zwei Mitarbeitenden richtig war, passt mit acht Mitarbeitenden und einem Lieferdienst nicht mehr. Umgekehrt zahlen Betriebe für Deckungen, die sie längst nicht mehr brauchen, etwa für eine Filiale, die geschlossen wurde, oder für Warenbestände, die kleiner geworden sind.

      Das ist dasselbe Muster, das wir bei Terminalgebühren sehen: Entscheidungen werden nicht mehr geprüft, wenn sich die Rahmenbedingungen ändern, und gewachsene Setups werden nur ergänzt statt neu betrachtet. Ein Check alle drei bis fünf Jahre oder bei jeder grösseren Veränderung (Umzug, Umbau, neue Mitarbeitende, neue Dienstleistung) stellt sicher, dass Deckung und Prämie zum heutigen Betrieb passen. Der Aufwand für Sie liegt bei einigen Minuten für die Angaben und beim Heraussuchen der bestehenden Policen.
  - heading: Wie der Broker bezahlt wird
    body: |
      Der Prämien-Check kostet Sie nichts. Der Broker wird von der Versicherungsgesellschaft über eine Courtage bezahlt, einen Anteil der Prämie, der bei jeder Police eingerechnet ist, ob ein Broker beteiligt ist oder nicht. Wenn Sie direkt bei der Versicherung abschliessen, behält die Gesellschaft diesen Anteil; mit Broker geht er an ihn. Für Sie ändert sich die Prämie dadurch nicht.

      Transparenz ist dabei dieselbe Bedingung, die wir an unsere eigenen [Konditionen](/konditionen) stellen: Der Broker legt auf Anfrage offen, welche Courtage er von welcher Gesellschaft erhält, und er ist an keine Gesellschaft gebunden. Wenn Ihre heutige Versicherung die passende ist, sagt er das, und Sie bleiben. Es gibt keine Pflicht, nach dem Check etwas abzuschliessen oder zu wechseln. ibis payment erhält für die Vermittlung keine Beteiligung an Ihrer Prämie [Vereinbarung mit Broker prüfen und bestätigen].
  - heading: So läuft der Prämien-Check ab
    body: |
      Der Check braucht am Anfang drei Angaben, die Sie im Formular unten eintragen: die Branche (Restaurant, Detailhandel, Coiffeur, Praxis, Handwerk, Büro), die Anzahl Mitarbeitende und eine Kontaktmöglichkeit, E-Mail oder Telefon. Mehr ist für den ersten Schritt nicht nötig.

      Der Broker meldet sich innert zwei Werktagen. Im Gespräch klärt er, welche Policen bestehen, und bittet Sie, die aktuellen Verträge oder die letzten Prämienrechnungen zu schicken. Daraus entsteht eine Übersicht: Welche Deckungen bestehen, wo Lücken oder Doppelungen sind, und was vergleichbare Angebote kosten würden. Sie entscheiden, ob Sie etwas ändern. Wechsel oder Anpassungen übernimmt der Broker, inklusive Kündigungsfristen bei der bisherigen Gesellschaft.

      Wenn Sie lieber zuerst mit Ihrem Berater bei ibis payment sprechen, erreichen Sie ihn über [Kontakt](/kontakt). Er kennt Ihren Betrieb und kann dem Broker die relevanten Angaben zum Setup mitgeben, etwa ob Online-Zahlungen laufen oder ob Kundendaten gespeichert werden, was für die Cyber-Deckung eine Rolle spielt.
  - heading: Was der Check nicht ist
    body: |
      Der Prämien-Check ist keine Beratung zu Vorsorge oder privaten Versicherungen der Inhaberin; er betrifft den Betrieb. Er ist auch kein Versprechen, dass die Prämie sinkt. Es kann sein, dass der Broker eine Lücke findet, deren Schliessung Geld kostet; dann wissen Sie es wenigstens und entscheiden bewusst. Und er ersetzt keine Rechtsberatung: Ob ein Mietvertrag bestimmte Deckungen verlangt, prüft der Broker im Rahmen des Checks, die Auslegung des Vertrags bleibt bei Ihnen oder Ihrem Treuhänder.

      Prämienzahlen nennen wir auf dieser Seite bewusst keine. Sie hängen von Branche, Umsatz, Mitarbeiterzahl, Standort und Schadenverlauf ab und wären ohne Ihre Angaben nicht belastbar. Die Zahlen bekommen Sie vom Broker, bezogen auf Ihren Betrieb.
