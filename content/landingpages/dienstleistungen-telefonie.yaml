faq:
- frage: Brauche ich für die Cloud-Telefonanlage neue Telefone?
  antwort: 'Nicht zwingend. Die Handy-App funktioniert auf vorhandenen Smartphones. Für den Empfang empfehlen wir ein Tischtelefon, das für Cloud-Anlagen gebaut ist; alte analoge Telefone lassen sich nur mit Adapter weiterverwenden, was wir in der Regel nicht empfehlen.

    '
- frage: Was passiert, wenn das Internet ausfällt?
  antwort: 'Die Geschäftsnummer wird auf das Handy im Mobilfunknetz weitergeleitet, wenn das so eingerichtet ist. Tischtelefone sind in dieser Zeit nicht erreichbar. Bei der Einrichtung legen wir fest, auf welches Handy die Umleitung läuft.

    '
- frage: Kann ich meine bisherige Nummer behalten?
  antwort: 'Ja. Die Portierung steht in der Preisliste mit CHF [0.00]. Sie unterschreiben ein Formular, der Rest läuft zwischen den Anbietern. Kündigen Sie den alten Vertrag erst, wenn die Portierung bestätigt ist.

    '
- frage: Sehen Mitarbeitende auf der App meine privaten Anrufe?
  antwort: 'Nein. Die App ist von der privaten Telefonfunktion getrennt. Mitarbeitende sehen nur Anrufe auf die Geschäftsnummer und können die App ausserhalb der Arbeitszeit abmelden.

    '
- frage: Wie lange bin ich gebunden?
  antwort: 'Die Anlage ist monatlich kündbar, nach demselben Grundsatz wie das Terminal. Gekaufte Tischtelefone gehören Ihnen. Die genauen Bedingungen stehen in der Offerte von [Telefonie-Partner].

    '
