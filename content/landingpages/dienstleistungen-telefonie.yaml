metaDescription: Cloud-Telefonanlage von peoplefone ab CHF 15 pro Monat, Business-Internet von iway bis 1 Gbit/s, eingerichtet von InfraOne in Winterthur. Preise und Ablauf.
kicker: Telefonie und Internet
lead: Geschäftsnummer und Telefonanlage aus der Cloud, dazu ein Internetanschluss, der Kasse, Terminal und Gäste-WLAN trägt. Beides richtet InfraOne IT Solutions ein und betreut es, dieselbe Firma, die Ihr Terminal ans Netz hängt.
intro: 'Die meisten Betriebe telefonieren mit einer Anlage, die vor Jahren installiert wurde, oder mit dem privaten Handy der Inhaberin. Beides hat Grenzen. Die alte Anlage ist an den Standort gebunden und kennt keine Handy-App. Das private Handy hat keine Geschäftsnummer, keine Ansage und keine Vertretung in den Ferien.


  Eine Cloud-Telefonanlage löst das. Die Anlage läuft beim Anbieter, der Betrieb braucht nur Internet und Endgeräte. ibis payment vermittelt die Telefonie an InfraOne IT Solutions; die Einrichtung vor Ort übernimmt derselbe Berater, der Terminal und Kasse installiert hat, zusammen mit unserem IT-Partner für Netzwerk und WLAN. Die Preise stehen unten als Platzhalter und werden in der Offerte bestätigt, ebenso der genaue Funktionsumfang [Funktionsumfang mit peoplefone-Tarif abgleichen].


  Diese Seite beschreibt, was die Anlage kann, wie sie mit Ihrem Netzwerk zusammenspielt und wie der Umzug der Nummer abläuft. Die Übersicht aller Dienstleistungen finden Sie unter [Dienstleistungen](/dienstleistungen).



  Die Telefonanlage kommt von peoplefone, einem Schweizer Anbieter mit öffentlicher Preisliste, der Internetanschluss von iway, ebenfalls aus der Schweiz. InfraOne wählt den passenden Tarif, richtet beides ein und bleibt Ihr Ansprechpartner. Die Listenpreise beider Anbieter stehen weiter unten, getrennt nach Telefonie, Internet und Einrichtung.'
sections:
- heading: Eine Geschäftsnummer auf Handy und Tischtelefon
  body: 'Der Kern der Cloud-Telefonanlage ist die Geschäftsnummer, die nicht an ein Gerät gebunden ist. Ein Anruf auf die Nummer des Betriebs klingelt gleichzeitig oder nacheinander auf dem Tischtelefon am Empfang, auf dem Handy der Inhaberin über eine App und bei Bedarf auf dem Telefon in der Küche oder im Lager. Wer abnimmt, hat das Gespräch; die anderen Geräte hören auf zu klingeln.


    Umgekehrt zeigt ein Anruf aus der App die Geschäftsnummer an, nicht die private Handynummer. Das ist für Rückrufe an Gäste oder Patienten wichtig: Die Nummer bleibt beim Betrieb, auch wenn die Person wechselt. Mitarbeitende installieren die App auf dem eigenen Handy und melden sie ausserhalb der Arbeitszeit ab, damit sie abends nicht mehr klingelt.


    Tischtelefone werden vorkonfiguriert geliefert, beschriftet und angeschlossen. Sie brauchen einen Netzwerkanschluss oder WLAN; Strom kommt bei Bedarf über das Netzwerkkabel (PoE).

    '
- heading: Öffnungszeiten-Ansage und Anrufbeantworter per E-Mail
  body: 'Ausserhalb der Öffnungszeiten hört der Anrufer eine Ansage mit den Zeiten und, wenn gewünscht, dem Hinweis auf die Online-Reservation oder die Website. Die Ansage schaltet sich nach dem hinterlegten Zeitplan selbst ein und aus, inklusive Feiertagen und Betriebsferien, die Sie selbst eintragen. Sie sprechen den Text selbst auf oder lassen ihn aus Text erzeugen.


    Hinterlässt jemand eine Nachricht, kommt sie als Tondatei per E-Mail. Sie hören sie auf dem Handy ab, ohne die Anlage anzurufen, und sehen, wer wann angerufen hat. Verpasste Anrufe während des Service werden ebenfalls per E-Mail gemeldet, mit Nummer und Uhrzeit, sodass ein Rückruf nach dem Service möglich ist.

    '
- heading: Warteschlange und Vertretung
  body: 'Wenn zwei Anrufe gleichzeitig kommen, landet der zweite in einer Warteschlange mit Ansage statt im Besetztzeichen. Die Schlange lässt sich nach Zeit begrenzen: Nach einer eingestellten Wartezeit wird der Anruf an das Handy weitergeleitet oder auf den Anrufbeantworter gelegt. Für einen Betrieb mit einer Person am Telefon reicht das. Grössere Betriebe oder mehrere Standorte bilden Gruppen, etwa Empfang, Küche, Büro.


    Für Ferien oder Krankheit richten Sie eine Umleitung ein, selbst über die Oberfläche oder per Anruf an den Berater. Die Geschäftsnummer bleibt erreichbar, auch wenn niemand im Betrieb ist.

    '
- heading: Zusammenspiel mit WLAN und Netzwerk
  body: 'Eine Cloud-Telefonanlage ist nur so gut wie die Internetverbindung. Gespräche brauchen wenig Bandbreite, aber eine stabile Leitung ohne Aussetzer. Darum prüfen wir vor der Einrichtung dieselben Dinge wie beim Terminal: Ist das Kassennetz vom Gäste-WLAN getrennt, gibt es einen Netzwerkanschluss am Empfang, hält das Internet auch bei vielen Gästen im WLAN.


    Tischtelefone hängen idealerweise am Kabel, nicht am WLAN. Die Handy-App funktioniert über WLAN und Mobilfunk und wechselt selbst. Fällt das Internet aus, lässt sich die Geschäftsnummer so einrichten, dass sie auf das Handy im Mobilfunknetz weiterläuft. Diese Einstellungen macht unser IT-Partner InfraOne bei der Einrichtung, zusammen mit dem Netzwerk für [Terminal und Kasse](/kassensysteme).

    '
- heading: Monatlich kündbar, keine Anlage im Keller
  body: 'Die Anlage wird pro Benutzer und Monat abgerechnet, monatlich kündbar und ohne Investition in Hardware, die nach Jahren ersetzt werden muss. Kommt ein Mitarbeiter dazu, kommt ein Benutzer dazu; geht er, fällt der Benutzer weg. Updates und Funktionen kommen vom Anbieter, ohne Technikereinsatz vor Ort.


    Die Preise stehen in der Preisliste unten als Platzhalter und werden in der Offerte mit allen Positionen bestätigt, nach demselben Grundsatz wie auf unserer Seite [Konditionen](/konditionen): Jede Gebühr steht in der Offerte, nichts kommt nachträglich dazu. Alle Preise exkl. MwSt. Tischtelefone werden gekauft, nicht gemietet, und gehören Ihnen.

    '
- heading: Umzug der Nummer
  body: 'Ihre bisherige Geschäftsnummer nehmen Sie mit. Die Portierung beantragt InfraOne IT Solutions beim bisherigen Anbieter; Sie unterschreiben ein Formular, der Rest läuft zwischen den Anbietern. Die Nummer wechselt an einem festgelegten Datum, meist innert weniger Wochen nach Auftrag, abhängig von der Kündigungsfrist beim alten Anbieter.


    Kündigen Sie den alten Vertrag nicht selbst, bevor die Portierung bestätigt ist, sonst kann die Nummer verloren gehen. Wir prüfen die Kündigungsfrist und stimmen das Datum mit dem Wechsel von Terminal oder Internet ab, wenn Sie beides gleichzeitig umstellen. Den Start machen Sie über [Kontakt](/kontakt); Sie erhalten eine Offerte mit Anzahl Benutzer, Geräten und Portierung.

    '
- heading: Internet, das den Betrieb trägt
  body: 'Kasse, Terminal, Telefonanlage, Musik, Kameras und das WLAN der Gäste hängen heute am selben Anschluss. Ein Privatabo reicht dafür oft, aber es gibt keinen Ansprechpartner, wenn am Samstagabend die Verbindung ausfällt. iway bietet symmetrische Business-Anschlüsse ab 20 Mbit/s bis 1 Gbit/s mit Router, Mindestlaufzeit 12 Monate, danach monatlich kündbar. Für Betriebe, die ohne Internet nicht kassieren können, gibt es Service-Vereinbarungen mit Störungsbehebung innert weniger Stunden.


    Für die meisten Betriebe mit ein bis drei Kassenplätzen genügen 100 Mbit/s. Mehrere Kassen, Kameras oder Backups in die Cloud sprechen für 1 Gbit/s. Welche Geschwindigkeit an Ihrer Adresse verfügbar ist, prüfen wir vor der Offerte. InfraOne trennt das Kassennetz vom Gäste-WLAN und gibt Terminal und Kasse Vorrang, damit eine Zahlung auch dann durchgeht, wenn zwanzig Gäste Videos streamen. Die [Konditionen](/konditionen) für die Kartenzahlung bleiben davon unberührt; Internet und Telefonie werden separat offeriert.'
