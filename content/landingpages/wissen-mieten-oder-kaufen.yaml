faq:
  - frage: Ab wann ist der Kauf günstiger als die Miete?
    antwort: |
      Rein rechnerisch nach etwa 21 Monaten beim Terminal zu CHF 19 und nach etwa 25 Monaten beim Terminal zu CHF 24. Nicht eingerechnet sind das Ersatzgerät in der Miete und das Defektrisiko nach der Garantie.
  - frage: Was passiert, wenn ein gekauftes Terminal kaputtgeht?
    antwort: |
      In den ersten 2 Jahren greift die Garantie bei Material- und Herstellungsfehlern. Danach, und bei Sturz oder Flüssigkeit, kaufen oder mieten Sie Ersatz. Bei der Miete ist das Ersatzgerät inbegriffen.
  - frage: Bekommt ein gekauftes Terminal Updates?
    antwort: |
      Ja. Die Updates, die das Terminal für die Zulassung braucht, gehören zum Acquiring-Vertrag, nicht zum Gerät. Ein gekauftes aktuelles Terminal bleibt auf dem gleichen Stand wie ein gemietetes.
  - frage: Kann ich von Miete auf Kauf wechseln?
    antwort: |
      Ja. Die Miete ist monatlich kündbar; ob das gemietete Terminal übernommen oder ein neues geliefert wird, klären wir in der Offerte. Eine Anrechnung bezahlter Mieten gibt es nicht.
  - frage: Ändert sich die Gebühr pro Zahlung, wenn ich kaufe?
    antwort: |
      Nein. Der Satz pro Kartenart und der Fixbetrag pro Zahlung sind bei Miete und Kauf gleich. Der Unterschied liegt nur bei den Gerätekosten.
  - frage: Wie buche ich Miete und Kauf?
    antwort: |
      Die Miete ist monatlicher Aufwand. Der Kauf wird aktiviert und abgeschrieben oder, je nach Praxis des Betriebs, bei kleinen Beträgen direkt als Aufwand gebucht. Klären Sie das mit Ihrem Treuhänder.
