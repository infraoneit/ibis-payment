kicker: Ostschweiz
lead: Für Betriebe in St. Gallen, Thurgau, Appenzell, Schaffhausen und Graubünden kommt der Berater vorbei, installiert das Terminal und bleibt erreichbar. Die Konditionen sind offen und monatlich kündbar.
intro: |
  In der Ostschweiz sind die Wege länger, und viele Betriebe liegen abseits: Hofläden mit Selbstbedienung, Bergrestaurants mit wechselndem Empfang, Dorfbäckereien, Gewerbe mit Werkstatt und Laden, Märkte und Feste mit saisonalem Umsatz. Dort zählt, dass jemand vorbeikommt, der das Terminal kennt.

  ibis payment vermittelt Terminals des Herstellers PayTec aus Effretikon, mit Abwicklung über das SwiPay-Bezahlnetzwerk. Die Gebühren stehen auf der Seite [Konditionen](/konditionen) und gelten in der Ostschweiz wie überall. Der Berater für die Region kommt in den Betrieb, installiert vor Ort und bleibt danach Ihr Ansprechpartner mit Direktwahl.
sections:
  - heading: Beratung und Installation in der Ostschweiz
    body: |
      Der erste Schritt ist ein Gespräch, im Betrieb oder am Telefon. Es geht um den Zahlort: Tresen, Tisch, Kasse, Stand, Automat. Dann schicken Sie uns Ihre letzte Abrechnung oder drei Zahlen, und Sie erhalten innert 24 Stunden eine Offerte, in der jede Gebühr einzeln steht.

      Die Installation macht der Berater selbst. Er bringt das Terminal, richtet es ein, bindet die Kasse über OPI, ZVT oder KIT an, prüft WLAN und Mobilfunkempfang am Zahlort und macht eine Testzahlung. Aufschaltung und Einrichtung kosten CHF 0. Danach bleibt er Ihr Ansprechpartner; bei einem Defekt erhalten Sie ein Ersatzgerät [Frist eintragen].

      Wir bedienen die Kantone St. Gallen, Thurgau, Appenzell Ausserrhoden und Innerrhoden, Schaffhausen und Graubünden [Einzugsgebiet und Anfahrt bestätigen]. Für die Region Winterthur und den Kanton Zürich gibt es eigene Seiten: [Zahlterminal Winterthur](/zahlterminal-winterthur) und [Zahlterminal Zürich](/zahlterminal-zuerich). Den Termin für das erste Gespräch vereinbaren Sie über [Kontakt](/kontakt).
  - heading: Typische Betriebe in der Ostschweiz
    body: |
      **Hofläden und Direktvermarkter.** Verkauf ab Hof, oft mit Selbstbedienung und ohne Personal. Für den bedienten Verkauf ein mobiles Terminal wie der [PayTec N62](/geraete/paytec-n62), das über 4G läuft, wo kein WLAN ist. Für die Selbstbedienung ein Automatenterminal, siehe unten.

      **Gastronomie und Tourismus.** Bergrestaurants, Hotels, Skihütten und Ausflugsziele haben Gäste aus dem In- und Ausland und oft schwankenden Empfang. Der [PayTec N96](/geraete/paytec-n96) mit Drucker und 18 Tagen Standby oder der [PayTec N86](/geraete/paytec-n86) mit Sturzschutz sind für lange Schichten und raue Umgebungen gebaut. Der Zuschlag für ausländische Karten steht bei uns in der Offerte.

      **Dorfbäckereien, Metzgereien, Käsereien.** Viele kleine Zahlungen am Tresen. Der [PayTec V3CT3](/geraete/paytec-v3ct3) mit Tastatur und Drucker, auf Wunsch mit Kunden-Pinpad, oder der [PayTec CT20P](/geraete/paytec-ct20p) für Betriebe mit Kasse.

      **Gewerbe und Werkstätten.** Garagen, Schreinereien, Sanitär- und Elektrobetriebe mit Laden oder Rechnungszahlung am Tresen. Ein stationäres Terminal, bei Bedarf ein mobiles für den Service beim Kunden.

      **Märkte, Feste, Vereine.** Saisonaler Umsatz, Terminal für einige Wochen. Die Miete ist monatlich kündbar, siehe [Zahlterminal mieten](/zahlterminal-mieten).
  - heading: Automaten und Selbstbedienung
    body: |
      Hofladen-Automaten, Selbstbedienungs-Kühlschränke, Getränkeautomaten, Parkplätze bei Ausflugszielen, Waschanlagen, Ladestationen: Dort zahlt der Kunde allein, oft im Freien und bei Minusgraden.

      Dafür gibt es zwei Terminals. Der [PayTec UN20](/geraete/paytec-un20) wird in den Automaten eingebaut, ist mit IP65 gegen Staub und Strahlwasser und mit IK10 gegen Schläge geschützt und läuft von minus 20 bis plus 70 Grad. Angebunden wird er über MDB oder RS232 an die Automatensteuerung. Der [PayTec N62 Vending](/geraete/paytec-n62-vending) ist die kompakte Variante für Automaten mit wenig Platz an geschützten Standorten.

      Beide nehmen Karten, Handy-Wallets und TWINT an [TWINT für Automaten bestätigen] und werden pro Projekt offeriert, weil Einbau und Anbindung je nach Automat verschieden sind. Ob UN20 oder N62 Vending passt, hängt vom Automaten, vom Standort und von der Steuerung ab. Das klären wir vor Ort.
  - heading: Was es kostet
    body: |
      Die Konditionen gelten für die Ostschweiz wie für die ganze Schweiz, alle Preise exkl. MwSt.: Debitkarten Inland 0.75 %, Kreditkarten Inland 1.25 %, TWINT 1.00 %, American Express 1.90 %, Ausland- und Firmenkarten plus 0.90 Prozentpunkte, CHF 0.05 pro Zahlung. Terminal-Miete ab CHF 19 pro Monat inklusive Wartung, Updates und Ersatzgerät, Kauf ab CHF 390. Automatenterminals nach Offerte.

      Keine Aufschaltgebühr, keine Mindestgebühr, keine Mindestlaufzeit, monatlich kündbar. Für saisonale Betriebe ist das der entscheidende Punkt: Wer im Winter wenig Umsatz hat, zahlt im Winter wenig. Gutschrift gesammelt pro Tag am nächsten Werktag, Abrechnung einmal pro Monat auf einer Seite.

      Die Beispielrechnung unten zeigt einen Hofladen mit kleinem Umsatz und tiefem Kreditkartenanteil. Setzen Sie Ihre eigenen Zahlen ein. Haben Sie heute schon ein Terminal, schicken Sie uns die Abrechnung: Wir unterbieten Ihre heutige Abrechnung, oder wir sagen Ihnen, dass es nicht geht.
  - heading: Verbindung, wo kein WLAN ist
    body: |
      Am Hof, auf der Alp und im Festzelt gibt es selten WLAN. Die mobilen Terminals von PayTec haben 4G eingebaut und brauchen nur Mobilfunkempfang. Wo beides vorhanden ist, wechseln sie automatisch zwischen WLAN und 4G. Ob der Empfang am Zahlort reicht, prüfen wir bei der Installation, nicht erst am ersten Markttag.

      Stationäre Terminals in Läden und Werkstätten brauchen LAN oder stabiles WLAN. Reicht das Netzwerk im Betrieb nicht, ziehen wir unseren Partner InfraOne IT Solutions aus Winterthur hinzu, der WLAN und Netzwerk einrichtet [Einsatzgebiet Ostschweiz bestätigen].

      Wer ein älteres Terminal hat, sollte den Wechsel nicht aufschieben: Viele ältere Terminals verlieren voraussichtlich ab 2027 die Zulassung. Worauf Sie beim Vergleich der Anbieter achten müssen, steht auf der Seite [Zahlterminal Vergleich](/zahlterminal-vergleich).
