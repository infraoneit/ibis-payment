faq:
  - frage: Kommt der Berater auch in abgelegene Betriebe in der Ostschweiz?
    antwort: |
      Ja. Beratung, Installation und Einweisung finden im Betrieb statt, in den Kantonen St. Gallen, Thurgau, Appenzell, Schaffhausen und Graubünden [Einzugsgebiet bestätigen]. Die Anfahrt klären wir vorab.
  - frage: Funktioniert das Terminal auf dem Hof oder auf der Alp ohne WLAN?
    antwort: |
      Ja, die mobilen Terminals haben 4G eingebaut. Ob der Mobilfunkempfang am Zahlort reicht, prüfen wir bei der Installation. Für Automaten im Freien hat der UN20 einen Anschluss für eine externe Antenne.
  - frage: Welches Terminal passt für einen Hofladen mit Selbstbedienung?
    antwort: |
      Ein Automatenterminal, das in den Verkaufsautomaten oder Kühlschrank eingebaut wird: der UN20 für den Aussenbereich, der N62 Vending für geschützte Standorte. Beide werden pro Projekt offeriert, weil die Anbindung an die Automatensteuerung je nach Modell verschieden ist.
  - frage: Sind die Konditionen in der Ostschweiz anders als in Zürich?
    antwort: |
      Nein. Die Sätze auf der Seite [Konditionen](/konditionen) gelten schweizweit. Es gibt keine Mindestgebühr, was für saisonale Betriebe mit schwachen Wintermonaten entscheidend ist.
  - frage: Kann ich das Terminal nur für die Saison mieten?
    antwort: |
      Ja. Die Miete ist monatlich kündbar, Sie zahlen nur für die Monate, in denen Sie das Terminal nutzen. Wie Rückgabe und Wiederaufschaltung ablaufen, regeln wir in der Offerte [Ablauf bestätigen].
  - frage: Wie schnell bekomme ich in der Ostschweiz Ersatz bei einem Defekt?
    antwort: |
      Ein Ersatzgerät erhalten Sie bei der Miete ohne Zusatzkosten [Frist eintragen]. Bis dahin können Sie Kartenzahlungen über die App Softpay auf dem Handy annehmen, siehe [Handy als Terminal](/handy-als-terminal).
