faq:
  - frage: Was kostet die Miete eines Zahlterminals?
    antwort: |
      Ab CHF 19 pro Monat für den N62 oder den V3CT3, CHF 24 pro Monat für N86, N96 und CT20P, exkl. MwSt. Wartung, Updates und Ersatzgerät sind enthalten. Dazu kommen die Gebühren pro Zahlung gemäss [Konditionen](/konditionen).
  - frage: Kann ich das Terminal nur für die Saison mieten?
    antwort: |
      Ja. Die Miete ist monatlich kündbar, Sie zahlen nur für die Monate, in denen Sie das Terminal nutzen. Rückgabe und Wiederaufschaltung in der nächsten Saison regeln wir in der Offerte [Ablauf bestätigen].
  - frage: Was passiert, wenn das gemietete Terminal kaputtgeht?
    antwort: |
      Sie erhalten ein Ersatzgerät ohne zusätzliche Kosten [Frist eintragen]. Bis dahin nehmen Sie Kartenzahlungen mit dem [Handy als Terminal](/handy-als-terminal) an, wenn Sie die App eingerichtet haben.
  - frage: Ist die Installation bei der Miete inbegriffen?
    antwort: |
      Ja. Ihr Berater kommt vor Ort, richtet das Terminal ein, bindet die Kasse an und prüft das WLAN. Aufschaltung und Einrichtung kosten CHF 0.
  - frage: Kann ich das Modell während der Miete wechseln?
    antwort: |
      Ja. Ändert sich Ihr Ablauf, etwa von Tresen auf Service am Tisch, tauschen wir das Terminal gegen ein passendes Modell. Danach gilt die Miete des neuen Modells.
  - frage: Ab wann lohnt sich der Kauf statt der Miete?
    antwort: |
      Als Faustregel ab etwa zwei Jahren Nutzung an einem festen Standort. Beim Kauf tragen Sie Reparatur und Nachrüstung nach Ablauf der Garantie selbst. Wir rechnen es mit Ihren Zahlen vor, siehe [Zahlterminal kaufen](/zahlterminal-kaufen).
