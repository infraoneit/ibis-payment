faq:
  - frage: Kommt der Berater in Zürich in den Betrieb?
    antwort: |
      Ja. Beratung, Installation, Kassenanbindung und Einweisung finden bei Ihnen statt, in der Stadt und im Kanton Zürich. Der Berater, der installiert, bleibt danach Ihr Ansprechpartner mit Direktwahl.
  - frage: Sind die Konditionen in Zürich anders als im Rest der Schweiz?
    antwort: |
      Nein. Die Sätze auf der Seite [Konditionen](/konditionen) gelten schweizweit und sind öffentlich. Was sich mit der Nähe ändert, ist der Service vor Ort.
  - frage: Welches Terminal passt für eine Bar mit Terrasse?
    antwort: |
      Ein mobiles Terminal mit WLAN und 4G, das automatisch wechselt, wenn eines ausfällt. Der N96 hat einen Drucker und einen Akku für lange Nächte, der N62 ist kompakt und schickt den Beleg digital. Beide geben Trinkgeld am Terminal ein.
  - frage: Was ist mit ausländischen Karten von Touristen?
    antwort: |
      Ausländische und Firmenkarten kosten einen Zuschlag von 0.90 Prozentpunkten auf den jeweiligen Satz. Der Zuschlag steht in der Offerte und auf der Abrechnung einzeln ausgewiesen. Wer viele Touristen bedient, sollte den Anteil aus der heutigen Abrechnung lesen und im Vergleich berücksichtigen.
  - frage: Wie schnell bekomme ich bei einem Defekt Ersatz?
    antwort: |
      Ein Ersatzgerät erhalten Sie [innert 24 Stunden, schweizweit], bei der Miete ohne Zusatzkosten. Bis dahin können Sie Kartenzahlungen über die App Softpay auf dem Handy annehmen, siehe [Handy als Terminal](/handy-als-terminal).
  - frage: Kann ich das Terminal nur für ein Event mieten?
    antwort: |
      Ja. Die Miete ist monatlich kündbar, ohne Mindestlaufzeit. Für Festivals, Märkte und Pop-ups mieten Sie das Terminal für die Dauer des Bedarfs; die Einrichtung ist inbegriffen.
