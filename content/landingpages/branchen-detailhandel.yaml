faq:
  - frage: Funktioniert das Terminal mit meiner bestehenden Kasse?
    antwort: |
      Wenn die Kasse OPI, ZVT oder KIT unterstützt, ja. Das klären wir vor der Installation mit Ihrem Kassenanbieter. Die Anbindung richten wir vor Ort ein, sie ist im Preis inbegriffen.
  - frage: Was kostet eine Zahlung von CHF 3?
    antwort: |
      Den Satz der Karte plus CHF 0.05 Fixbetrag, exkl. MwSt. Bei Kleinbeträgen macht der Fixbetrag den grösseren Teil aus. Deshalb lohnt sich der Vergleich des Fixbetrags mehr als der Vergleich der Prozentsätze.
  - frage: Brauche ich für den Self-Checkout ein spezielles Terminal?
    antwort: |
      Ein kassenintegriertes Terminal mit physischem PIN-Pad und fester Montage, wie der CT20P. Der Betrag kommt von der Kasse, der Kunde bedient das PIN-Pad selbst, das Kensington-Schloss sichert das Terminal.
  - frage: Kann ich für die Weihnachtszeit ein zusätzliches Terminal nehmen?
    antwort: |
      Ja. Die Miete ist monatlich kündbar und die Aufschaltung kostet CHF 0. Ein zusätzlicher CT20P oder ein mobiler N62 lässt sich für die Saison dazunehmen und danach zurückgeben.
  - frage: Wie stimmt die Gutschrift mit dem Kassenabschluss überein?
    antwort: |
      Die Gutschrift erfolgt gesammelt pro Tag am nächsten Werktag. Jeder Kalendertag ergibt eine Summe, die Sie mit dem Kassenabschluss desselben Tages abgleichen. Jede einzelne Zahlung sehen Sie im Händlerportal.
