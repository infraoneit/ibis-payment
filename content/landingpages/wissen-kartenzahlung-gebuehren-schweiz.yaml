faq:
  - frage: Warum sind Debitkarten für den Betrieb günstiger als Kreditkarten?
    antwort: |
      Weil der Interchange-Anteil tiefer ist. Für Debit Mastercard gilt 0.12 %, für Kreditkarten 0.44 %, jeweils für Inlandzahlungen am Verkaufspunkt nach WEKO. Dieser Anteil geht an die kartenausgebende Bank und ist für alle Anbieter gleich.
  - frage: Ist Interchange++ günstiger als ein fester Satz?
    antwort: |
      Nicht automatisch. Interchange++ zeigt die drei Anteile getrennt, verrechnet aber dieselben Kosten. Ob es günstiger ist, hängt von der Marge ab, die der Anbieter daraufschlägt, und von Ihrem Kartenmix. Vergleichen Sie beide Modelle über den effektiven Satz.
  - frage: Was ist der effektive Satz?
    antwort: |
      Alle Gebühren eines Monats inklusive Fixbeträge, Zuschläge und Terminalmiete, geteilt durch den Kartenumsatz desselben Monats. Mit dieser Zahl lassen sich zwei Angebote mit unterschiedlicher Struktur vergleichen.
  - frage: Warum kostet eine Zahlung mit Apple Pay dasselbe wie mit der Karte?
    antwort: |
      Apple Pay, Google Pay und Samsung Pay sind keine eigenen Kartenarten. Hinter der Wallet liegt eine Debit- oder Kreditkarte, und diese Karte bestimmt Interchange und Satz. Bei uns gibt es keinen Wallet-Zuschlag.
  - frage: Gibt es Gebühren, die nicht auf der Preisliste stehen?
    antwort: |
      Bei uns nicht. Was nicht auf der [Preisliste](/konditionen) steht, wird nicht verrechnet. Bei anderen Anbietern prüfen Sie die Abrechnung auf Mindestgebühren, Portalgebühren, Beleggebühren und Aufschaltgebühren.
  - frage: Wie oft sollte ich die Gebühren prüfen?
    antwort: |
      Einmal im Jahr, mit einer vollständigen Monatsabrechnung. Die Interchange-Sätze wurden zuletzt 2024 und 2025 neu festgelegt, und ein Angebot, das vor Jahren fair war, muss es heute nicht mehr sein.
