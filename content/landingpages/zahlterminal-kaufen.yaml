faq:
  - frage: Was kostet ein Zahlterminal im Kauf?
    antwort: |
      CHF 390 für den N62 oder den V3CT3, CHF 590 für N86, N96 und CT20P, exkl. MwSt. Automatenterminals werden pro Projekt offeriert. Dazu kommen die Gebühren pro Zahlung gemäss [Konditionen](/konditionen), die bei Kauf und Miete gleich sind.
  - frage: Wie lange ist die Garantie?
    antwort: |
      Zwei Jahre ab Installation. In dieser Zeit wird ein defektes Terminal repariert oder ersetzt. Danach tragen Sie Reparatur oder Ersatz selbst, ausser Sie buchen einen Wartungsservice dazu [Konditionen eintragen].
  - frage: Muss ich beim Kauf einen Acquiring-Vertrag abschliessen?
    antwort: |
      Ja. Das Terminal braucht einen Vertrag für die Abwicklung der Zahlungen über das SwiPay-Netzwerk. Dieser Vertrag ist monatlich kündbar und hat keine Mindestgebühr. Das gekaufte Terminal bleibt in jedem Fall Ihr Eigentum.
  - frage: Ist das gekaufte Terminal ab 2027 noch zugelassen?
    antwort: |
      Alle Modelle, die wir vermitteln, erfüllen PCI PTS 6.x und sind ep2-zertifiziert, also die aktuelle Generation [Stand bestätigen]. Ältere Terminals mit früheren Zertifizierungen sind von der Zulassungsfrage betroffen und sollten nicht mehr gekauft werden.
  - frage: Kann ich ein gekauftes Terminal an eine Kasse anbinden?
    antwort: |
      Ja. Der CT20P, der N96 und der V3CT3 unterstützen die Kassenprotokolle OPI, ZVT oder KIT. Die Anbindung ist Teil der Installation vor Ort und kostet nichts extra. Welche Kassensysteme wir kennen, steht unter [Kassensysteme](/kassensysteme).
  - frage: Kann ich zuerst mieten und später kaufen?
    antwort: |
      Ja. Viele Betriebe starten mit der Miete und entscheiden nach einigen Monaten. Ob das gemietete Terminal übernommen werden kann und zu welchem Preis, klären wir in der Offerte [Übernahmekonditionen eintragen].
