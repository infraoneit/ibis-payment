faq:
  - frage: Gehört mir die Website, oder bleibt sie beim Anbieter?
    antwort: |
      Sie gehört Ihnen. Domain, Inhalte und Zugangsdaten werden auf Ihren Namen eingerichtet und Ihnen bei der Abnahme übergeben. Wenn Sie später den Anbieter wechseln wollen, nehmen Sie die Website mit.
  - frage: Kann ich eine bestehende Website überarbeiten lassen, statt neu zu bauen?
    antwort: |
      Ja. InfraOne prüft, auf welchem System die bestehende Website läuft und ob sie sich mit vertretbarem Aufwand aktualisieren lässt. Bei älteren Systemen ist ein Neubau oft günstiger als ein Umbau, weil Sicherheitslücken und fehlende Mobilfähigkeit sonst mitgeschleppt werden.
  - frage: Reicht ein Google-Business-Profil ohne eigene Website?
    antwort: |
      Für den Anfang ja, auf Dauer nicht. Das Profil zeigt Adresse, Öffnungszeiten und Bewertungen, aber keine Speisekarte, kein Team, keine Reservation, und es gehört Google, nicht Ihnen. Üblich ist beides: Profil für die lokale Suche, Website für die Entscheidung.
  - frage: Wie lange dauert ein Website-Projekt?
    antwort: |
      Das hängt vor allem davon ab, wann Texte, Fotos und Logo vorliegen. InfraOne nennt in der Offerte einen Termin, der von der Vollständigkeit Ihrer Unterlagen ausgeht. Unter [Website erstellen lassen](/webdesign/website-erstellen-lassen) steht der Ablauf mit den einzelnen Schritten.
  - frage: Kann die Website Zahlungen entgegennehmen?
    antwort: |
      Ja. Gutscheine, Anzahlungen oder Produkte lassen sich über [Online-Zahlungen](/online-zahlungen) mit TWINT, Karte und PostFinance bezahlen. Die Gebühren dafür stehen auf der Seite [Konditionen](/konditionen).
  - frage: An wen wende ich mich bei Fragen zur Website?
    antwort: |
      Für die Website direkt an InfraOne IT Solutions in Winterthur, für Terminal, Kasse und Abrechnung an Ihren Berater bei ibis payment. Beide kennen sich und sprechen sich ab, wenn ein Thema beide Seiten betrifft.
