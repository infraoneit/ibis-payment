intro: |
  Viele Betriebe, die bei uns ein Terminal mieten, stellen dieselbe zweite Frage: Wer baut uns eine Website, die wir selbst pflegen können, ohne dass wir einen weiteren Dienstleister suchen müssen. Darum vermitteln wir Webdesign an einen Partner, den wir aus der täglichen Arbeit kennen: InfraOne IT Solutions GmbH in Winterthur ([infraone.ch](https://infraone.ch)). InfraOne baut Websites für KMU, richtet E-Mail und Microsoft 365 ein und betreut Netzwerk, Backup und Support.

  Diese Seite erklärt, was eine Website für einen Betrieb heute leisten muss, wie ein Projekt abläuft, welche Faktoren den Preis bestimmen und was nach dem Start zu tun ist. Für einzelne Branchen gibt es eigene Seiten: [Restaurant](/webdesign/homepage-restaurant), [Coiffeur](/webdesign/homepage-coiffeur) und [Praxis](/webdesign/homepage-praxis).

  Wenn Sie schon wissen, was Sie brauchen, schicken Sie die Anfrage über das Formular unten. Sie geht direkt an InfraOne, und Sie erhalten eine Offerte mit Festpreis und Lieferumfang.
sections:
  - heading: Was eine KMU-Website heute braucht
    body: |
      Die Anforderungen haben sich verschoben. Vor zehn Jahren reichte eine Startseite mit Adresse und Öffnungszeiten. Heute suchen Gäste und Kunden auf dem Handy, oft unterwegs, und entscheiden in Sekunden. Daraus ergeben sich sechs Punkte, die jede Website eines Betriebs erfüllen sollte.

      - **Mobil zuerst.** Der grössere Teil der Besucher kommt über das Smartphone. Text, Buttons und Formulare müssen auf einem kleinen Bildschirm ohne Zoomen bedienbar sein.
      - **Ladezeit.** Grosse Bilder und unnötige Skripte kosten Sekunden. Wer wartet, geht zum nächsten Treffer.
      - **Google-Business-Profil.** Das Profil mit Öffnungszeiten, Adresse, Fotos und Bewertungen erscheint bei lokalen Suchen vor der Website. Beides muss zusammenpassen: gleiche Zeiten, gleiche Telefonnummer, gleicher Name.
      - **Impressum und Datenschutz.** Seit September 2023 gilt das revidierte Datenschutzgesetz (DSG). Eine Datenschutzerklärung, die beschreibt, welche Daten die Website erhebt (Formulare, Cookies, Analyse), gehört zum Standard.
      - **Reservation oder Terminbuchung.** Ein Restaurant braucht eine Reservation, ein Coiffeur oder eine Praxis eine Terminbuchung oder zumindest eine Terminanfrage. Beides spart Telefonzeit.
      - **Zahlung online.** Gutscheine, Anzahlungen oder Produkte lassen sich über die Website bezahlen. Wie das mit [Online-Zahlungen](/online-zahlungen) über TWINT und Karte funktioniert, zeigen wir Ihnen gern.
  - heading: So läuft ein Website-Projekt ab
    body: |
      Der Ablauf bei InfraOne ist in vier Schritte gegliedert. Erstens ein Gespräch, telefonisch oder vor Ort: Welche Seiten braucht der Betrieb, wer liefert Texte und Fotos, gibt es eine bestehende Domain und ein Logo. Daraus entsteht eine Offerte mit Festpreis und Lieferumfang. Zweitens der Entwurf: Sie sehen eine Startseite und eine Unterseite als Vorschau und geben Rückmeldung. Drittens der Aufbau aller Seiten, inklusive Impressum, Datenschutzerklärung, Google-Business-Profil und Einbindung von Reservation oder Terminbuchung. Viertens die Abnahme und der Start: Die Domain wird umgehängt, die Website geht online, und Sie erhalten eine Einführung, wie Sie Texte, Fotos und Öffnungszeiten selbst anpassen.

      Was Sie dafür bereitstellen müssen, haben wir unter [Website erstellen lassen](/webdesign/website-erstellen-lassen) als Checkliste zusammengestellt. Je vollständiger die Unterlagen beim Start sind, desto kürzer die Laufzeit des Projekts. Fehlende Texte sind in der Praxis der häufigste Grund, weshalb sich ein Start verzögert.
  - heading: Was eine Website kostet
    body: |
      Der Preis hängt von vier Faktoren ab, nicht von der Branche: der Anzahl Seiten, dem Umfang der Funktionen (Reservation, Terminbuchung, Online-Zahlung, Mehrsprachigkeit), der Herkunft der Inhalte (liefern Sie Texte und Fotos, oder müssen sie erstellt werden) und dem Pflegemodell nach dem Start.

      Eine Website mit bis zu zehn Unterseiten, eigener Domain, Impressum und Datenschutzerklärung, die Sie selbst pflegen, beginnt bei InfraOne pauschal bei [ab CHF 1'200]. Jede Funktion darüber hinaus wird in der Offerte einzeln ausgewiesen, mit Preis und Beschreibung, so wie Sie es von unseren [Konditionen](/konditionen) für Terminals kennen.

      Dazu kommen laufende Kosten: Domain, Hosting und bei Bedarf ein Pflegevertrag. Diese Positionen stehen in der Offerte getrennt vom Projektpreis, damit Sie wissen, was einmalig und was wiederkehrend ist. Alle Preise verstehen sich exkl. MwSt.
  - heading: Ein Ansprechpartner für Kasse, Terminal, WLAN und Website
    body: |
      Wer bei ibis payment ein Terminal bezieht, hat einen Berater, der den Betrieb von innen kennt. Er hat das Terminal installiert, die Kasse angebunden und das WLAN geprüft. Genau dieses Wissen fehlt einer Webagentur, die den Betrieb nie betreten hat. InfraOne arbeitet mit unseren Beratern zusammen und erhält die Angaben, die für die Website relevant sind: welches Kassensystem läuft, ob Online-Zahlungen bereits eingerichtet sind, welche Öffnungszeiten gelten.

      Für Sie heisst das: eine Nummer für Terminal, Kasse, Netzwerk, E-Mail und Website. Wenn eine Reservation nicht ankommt, müssen Sie nicht klären, ob der Fehler bei der Website, beim Mailserver oder beim WLAN liegt. Der Partner, der die Website gebaut hat, kennt auch den Rest der Infrastruktur. Fragen zum Zusammenspiel mit Terminal und Kasse beantworten wir über [Kontakt](/kontakt), Fragen zur Website beantwortet InfraOne direkt.
  - heading: Pflege nach dem Start
    body: |
      Eine Website ist nach dem Start nicht fertig. Drei Dinge müssen laufend gepflegt werden. Erstens die Inhalte: Öffnungszeiten, Preise, Speisekarte, Team. Das erledigen Sie selbst, über eine Oberfläche ohne Programmierkenntnisse. Zweitens die Technik: Updates des Systems, Sicherheitspatches, Backups. Das übernimmt InfraOne im Rahmen eines Pflegevertrags oder nach Aufwand. Drittens die Sichtbarkeit: Google-Business-Profil aktuell halten, auf Bewertungen antworten, neue Fotos einstellen. Das kostet wenig Zeit pro Monat und wirkt länger als jede Anzeige.

      Wenn Sie keinen Pflegevertrag wollen, gehört die Website trotzdem Ihnen, inklusive Domain und Zugangsdaten. Sie können jederzeit wechseln. Das ist derselbe Grundsatz wie bei unseren Terminals: monatlich kündbar, keine Bindung über den Nutzen hinaus.
