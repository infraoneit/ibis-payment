intro: |
  Wer bei uns ein Terminal mietet, braucht oft auch eine Website, die er selbst pflegen kann, ohne einen weiteren Dienstleister zu suchen. Darum vermitteln wir Webdesign an einen Partner, den wir aus der täglichen Arbeit kennen: InfraOne IT Solutions GmbH in Winterthur ([infraone.ch](https://infraone.ch)). InfraOne baut Websites für KMU, richtet E-Mail und Microsoft 365 ein und betreut Netzwerk, Backup und Support.

  Diese Seite erklärt, was eine Website für einen Betrieb leisten muss, wie ein Projekt abläuft, was den Preis bestimmt und was nach dem Start zu tun ist. Für einzelne Branchen gibt es eigene Seiten: [Restaurant](/webdesign/homepage-restaurant), [Coiffeur](/webdesign/homepage-coiffeur) und [Praxis](/webdesign/homepage-praxis).

  Wenn Sie schon wissen, was Sie brauchen, schicken Sie die Anfrage über das Formular unten. Sie geht direkt an InfraOne. Sie erhalten eine Offerte mit Festpreis und Lieferumfang.
sections:
  - heading: Was eine KMU-Website heute braucht
    body: |
      Gäste und Kunden suchen auf dem Handy, oft unterwegs. Daraus ergeben sich sechs Punkte, die jede Website eines Betriebs erfüllen sollte.

      - **Mobil zuerst.** Text, Buttons und Formulare müssen auf einem kleinen Bildschirm ohne Zoomen bedienbar sein.
      - **Schlanke Technik.** Grosse Bilder und unnötige Skripte machen die Seite im Mobilfunknetz langsam. Bilder werden deshalb für die Website verkleinert, Skripte nur eingebaut, wenn sie etwas tun.
      - **Google-Business-Profil.** Bei lokalen Suchen zeigt Google das Profil mit Öffnungszeiten, Adresse, Fotos und Bewertungen direkt in den Ergebnissen an. Profil und Website müssen zusammenpassen: gleiche Zeiten, gleiche Telefonnummer, gleicher Name.
      - **Impressum und Datenschutz.** Seit September 2023 gilt das revidierte Datenschutzgesetz (DSG). Eine Datenschutzerklärung, die beschreibt, welche Daten die Website erhebt (Formulare, Cookies, Analyse), gehört zum Standard.
      - **Reservation oder Terminbuchung.** Ein Restaurant braucht eine Reservation, ein Coiffeur oder eine Praxis eine Terminbuchung oder zumindest eine Terminanfrage. Beides spart Telefonzeit.
      - **Zahlung online.** Gutscheine, Anzahlungen oder Produkte lassen sich über die Website bezahlen. Wie das mit [Online-Zahlungen](/online-zahlungen) über TWINT und Karte funktioniert, zeigen wir Ihnen gern.
  - heading: So läuft ein Website-Projekt ab
    body: |
      Der Ablauf bei InfraOne hat vier Schritte. Erstens ein Gespräch, telefonisch oder vor Ort: Welche Seiten braucht der Betrieb, wer liefert Texte und Fotos, gibt es eine bestehende Domain und ein Logo. Daraus entsteht eine Offerte mit Festpreis und Lieferumfang. Zweitens der Entwurf: Sie sehen eine Startseite und eine Unterseite als Vorschau und geben Rückmeldung. Drittens der Aufbau aller Seiten, inklusive Impressum, Datenschutzerklärung, Google-Business-Profil und Einbindung von Reservation oder Terminbuchung. Viertens Abnahme und Start: Die Domain wird umgehängt, die Website geht online, und Sie erhalten eine Einführung, wie Sie Texte, Fotos und Öffnungszeiten selbst anpassen.

      Was Sie dafür bereitstellen müssen, steht unter [Website erstellen lassen](/webdesign/website-erstellen-lassen) als Checkliste. Je vollständiger die Unterlagen beim Start sind, desto kürzer das Projekt. Wenn sich ein Start verzögert, liegt es meist an fehlenden Texten.
  - heading: Was eine Website kostet
    body: |
      Der Preis hängt von vier Faktoren ab, nicht von der Branche: der Anzahl Seiten, dem Umfang der Funktionen (Reservation, Terminbuchung, Online-Zahlung, Mehrsprachigkeit), der Herkunft der Inhalte (liefern Sie Texte und Fotos, oder müssen sie erstellt werden) und dem Pflegemodell nach dem Start.

      Eine Website mit eigener Domain, Impressum und Datenschutzerklärung, die Sie selbst pflegen, kostet bei InfraOne pauschal ab CHF [1'200] exkl. MwSt. [Umfang und Preis mit InfraOne bestätigen]. Jede Funktion darüber hinaus wird in der Offerte einzeln ausgewiesen, mit Preis und Beschreibung, so wie Sie es von unseren [Konditionen](/konditionen) für Terminals kennen.

      Dazu kommen laufende Kosten: Domain, Hosting und bei Bedarf ein Pflegevertrag. Diese Positionen stehen in der Offerte getrennt vom Projektpreis, damit Sie wissen, was einmalig und was wiederkehrend ist.
  - heading: Ein Ansprechpartner für Kasse, Terminal, WLAN und Website
    body: |
      Wer bei ibis payment ein Terminal bezieht, hat einen Berater, der den Betrieb von innen kennt. Er hat das Terminal installiert, die Kasse angebunden und das WLAN geprüft. Eine Agentur, die den Betrieb nie betreten hat, muss das alles erst erfragen. InfraOne arbeitet mit unseren Beratern zusammen und erhält die Angaben, die für die Website relevant sind: welches Kassensystem läuft, ob Online-Zahlungen bereits eingerichtet sind, welche Öffnungszeiten gelten.

      Für Sie heisst das: eine Nummer für Terminal, Kasse, Netzwerk, E-Mail und Website. Wenn eine Reservation nicht ankommt, müssen Sie nicht klären, ob der Fehler bei der Website, beim Mailserver oder beim WLAN liegt. Fragen zum Zusammenspiel mit Terminal und Kasse beantworten wir über [Kontakt](/kontakt), Fragen zur Website beantwortet InfraOne direkt.
  - heading: Pflege nach dem Start
    body: |
      Eine Website ist nach dem Start nicht fertig. Drei Dinge müssen laufend gepflegt werden. Erstens die Inhalte: Öffnungszeiten, Preise, Speisekarte, Team. Das erledigen Sie selbst, über eine Oberfläche ohne Programmierkenntnisse. Zweitens die Technik: Updates des Systems, Sicherheitspatches, Backups. Das übernimmt InfraOne im Rahmen eines Pflegevertrags oder nach Aufwand. Drittens die Sichtbarkeit: Google-Business-Profil aktuell halten, auf Bewertungen antworten, neue Fotos einstellen. Das kostet wenige Minuten pro Woche.

      Wenn Sie keinen Pflegevertrag wollen, gehört die Website trotzdem Ihnen, inklusive Domain und Zugangsdaten. Sie können jederzeit wechseln. Das ist derselbe Grundsatz wie bei unseren Terminals: monatlich kündbar, keine Bindung über den Nutzen hinaus.
