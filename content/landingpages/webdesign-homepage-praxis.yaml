faq:
  - frage: Was kostet eine Website für eine Praxis?
    antwort: |
      Eine Website mit Leistungen, Team, Notfall-Info, Terminanfrage, Impressum und Datenschutzerklärung kostet bei InfraOne pauschal ab CHF [1'200] exkl. MwSt. [Umfang und Preis mit InfraOne bestätigen]. Online-Terminbuchung mit Kalender, Mehrsprachigkeit und Online-Zahlung stehen als eigene Positionen in der Offerte.
  - frage: Darf ein Kontaktformular nach dem Grund des Besuchs fragen?
    antwort: |
      Besser nicht. Angaben zur Gesundheit sind besonders schützenswerte Personendaten nach DSG und sollten nicht unverschlüsselt per E-Mail verschickt werden. Das Formular nimmt Name, Telefonnummer und Zeitraum entgegen; der Rest wird am Telefon geklärt.
  - frage: Kann eine Online-Terminbuchung mit Kalender eingebunden werden?
    antwort: |
      Ja, über ein System, das für Praxen geeignet ist und die Daten unter Schweizer Datenschutz speichert. InfraOne bindet das System auf der Website ein und stimmt die Einbindung mit Ihrer Praxissoftware ab. Nennen Sie im Formular, welches System Sie nutzen oder in Betracht ziehen.
  - frage: Brauche ich Cookie-Banner und Tracking?
    antwort: |
      Eine Praxis-Website kommt in der Regel ohne Tracking aus. Wenn keine Analyse-Werkzeuge und keine Einbindungen von Drittanbietern laufen, braucht es keinen Cookie-Banner. Das macht die Website schlanker und die Datenschutzerklärung kürzer.
  - frage: Kann ich die Notfall-Info und die Ferienzeiten selbst ändern?
    antwort: |
      Ja. Dafür gibt es ein eigenes Feld in der Pflegeoberfläche, das Sie ohne Programmierkenntnisse anpassen. Die Änderung ist sofort auf allen Seiten sichtbar.
  - frage: Ist die Website barrierefrei?
    antwort: |
      Sie wird nach den gängigen Grundsätzen gebaut: Kontrast, skalierbare Schrift, Alternativtexte, Tastaturbedienung, saubere Struktur. Eine formale Zertifizierung ist nicht enthalten, kann aber auf Wunsch offeriert werden.
