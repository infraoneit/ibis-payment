lead: Eine Praxis-Website hat andere Pflichten als ein Restaurant. Patientinnen und Patienten suchen Leistungen, Öffnungszeiten und einen Termin, und die Website muss dabei sorgfältiger mit Daten umgehen als jede andere.
intro: |
  Für eine Arztpraxis, eine Physiotherapie oder eine Zahnarztpraxis ist die Website oft der erste Kontakt. Neue Patientinnen und Patienten prüfen, ob die Praxis die gesuchte Leistung anbietet, ob sie neue Patienten aufnimmt, wie sie erreichbar ist und was im Notfall gilt. Die Website muss diese Fragen beantworten, ohne dass jemand anrufen muss.

  ibis payment vermittelt Praxis-Websites an InfraOne IT Solutions GmbH in Winterthur ([infraone.ch](https://infraone.ch)). InfraOne richtet in Praxen auch Netzwerk, E-Mail und Backup ein, während unser Berater das Terminal am Empfang installiert und bei Bedarf an die Kasse anbindet. Ein Ansprechpartner für die ganze Infrastruktur.

  Diese Seite beschreibt, was eine Praxis-Website braucht und worauf beim Datenschutz zu achten ist. Preisfaktoren und Ablauf stehen auf der Seite [Webdesign](/webdesign), die Checkliste für die Anfrage unter [Website erstellen lassen](/webdesign/website-erstellen-lassen).
sections:
  - heading: Leistungen und Team klar benennen
    body: |
      Patientinnen und Patienten suchen nach einer Leistung, nicht nach einer Praxis: «Physiotherapie nach Knieoperation», «Zahnreinigung», «Hausarzt nimmt neue Patienten». Die Website sollte jede Leistung auf einer eigenen Seite oder in einem eigenen Abschnitt beschreiben, in verständlicher Sprache, ohne Fachbegriffe, die ein Laie nicht einordnen kann. Was wird gemacht, wie lange dauert es, was muss der Patient mitbringen.

      Die Teamseite nennt Name, Funktion, Fachgebiet und Sprachen. Für Praxen, die neue Patienten aufnehmen, gehört dieser Hinweis gut sichtbar auf die Startseite; wer keine aufnimmt, sagt das ebenso deutlich und spart sich Anrufe. Sprechzeiten pro Person sind sinnvoll, wenn das Team in Teilzeit arbeitet.
  - heading: Notfall-Info, die man sofort findet
    body: |
      Wer die Website einer Praxis am Samstagabend aufruft, hat meist ein akutes Problem. Die Notfall-Information gehört deshalb auf jede Seite, sichtbar ohne Scrollen: Was tun ausserhalb der Sprechzeiten, welche Notfallnummer gilt (regionaler Notfalldienst, 144 bei Lebensgefahr, zahnärztlicher Notfalldienst), wer vertritt die Praxis in den Ferien.

      Diesen Bereich müssen Sie selbst in Minuten anpassen können, zum Beispiel wenn eine Ferienvertretung beginnt. InfraOne richtet dafür ein eigenes Feld in der Pflegeoberfläche ein, damit Sie nicht in der Seitenstruktur suchen müssen. Die Änderung ist danach auf allen Seiten sichtbar.
  - heading: Terminanfrage ohne Gesundheitsdaten im Formular
    body: |
      Eine Online-Terminanfrage entlastet den Empfang. Sie muss aber so gebaut sein, dass keine Gesundheitsdaten über das Formular laufen. Ein Formular, das nach dem Grund des Besuchs fragt, sammelt besonders schützenswerte Personendaten nach DSG und verschickt sie oft unverschlüsselt per E-Mail. Das sollte eine Praxis vermeiden.

      Der sinnvolle Aufbau: Name, Telefonnummer, gewünschter Zeitraum, bestehender oder neuer Patient. Kein Freitextfeld für Beschwerden, oder ein Feld mit dem Hinweis, keine Angaben zur Gesundheit einzutragen. Die Praxis ruft zurück und klärt den Rest am Telefon. Wer eine Online-Terminbuchung mit Kalender will, nutzt dafür ein System, das für Praxen geeignet ist und die Daten in der Schweiz oder unter gleichwertigem Datenschutz speichert. InfraOne bindet ein solches System ein, betreibt aber selbst keines.
  - heading: Datenschutz nach DSG
    body: |
      Seit September 2023 gilt das revidierte Datenschutzgesetz. Für eine Praxis-Website heisst das: Die Datenschutzerklärung beschreibt, welche Daten die Website erhebt (Formulare, Serverprotokolle, allfällige Analyse-Werkzeuge), wohin sie gehen und wie lange sie bleiben. Werkzeuge, die Daten in Drittländer übertragen, sind zu prüfen oder wegzulassen; eine Praxis-Website kommt in der Regel ohne Tracking aus.

      Das Kontaktformular wird verschlüsselt übertragen (SSL), die eingehenden Anfragen landen in einem Postfach, das nur berechtigte Personen lesen. Keine Patientendaten auf der Website speichern, keine Bilder von Patienten ohne schriftliche Einwilligung. Das Impressum nennt die verantwortliche Person und die Praxis als Betreiberin. InfraOne liefert die Datenschutzerklärung passend zu dem, was die Website tatsächlich tut, nicht als Kopie einer fremden Seite. Die rechtliche Prüfung bleibt bei Ihnen, Ihrem Berufsverband oder einer Fachperson für Datenschutz.
  - heading: Barrierefreiheit ist Teil der Leistung
    body: |
      Ein Teil der Patientinnen und Patienten sieht schlecht, ist älter oder bedient das Handy mit einer Hand. Barrierefreiheit heisst deshalb: ausreichender Kontrast, Schrift, die sich vergrössern lässt, Buttons, die man trifft, Bilder mit Alternativtext, eine Seitenstruktur, die ein Vorleseprogramm versteht. Das sind keine Zusatzfunktionen, sondern die Art, wie die Website gebaut wird.

      Dazu gehört auch die Wegbeschreibung: Parkplätze, Lift, rollstuhlgängiger Zugang, öffentlicher Verkehr. Ein Foto vom Eingang hilft Menschen, die die Praxis zum ersten Mal besuchen. Eine formale Zertifizierung der Barrierefreiheit ist nicht Teil der Pauschale, kann aber offeriert werden.
  - heading: Krankenkassen-Hinweise und Abrechnung
    body: |
      Patientinnen und Patienten wollen vor dem ersten Termin wissen, wie abgerechnet wird. Für die Website heisst das: Welche Leistungen gehen über die Grundversicherung, welche über eine Zusatzversicherung, was wird direkt bezahlt. Bei Therapien gehört der Hinweis dazu, ob eine ärztliche Verordnung nötig ist. Bei Zahnärzten, dass die Behandlung in der Regel privat bezahlt wird und ein Kostenvoranschlag möglich ist. Die Angaben dazu liefert die Praxis; InfraOne bringt sie verständlich auf die Seite.

      Wer am Empfang mit Karte oder TWINT bezahlen lässt, sagt das auf der Website. Das Terminal am Empfang kommt von ibis payment; die Gebühren stehen auf der Seite [Konditionen](/konditionen), Fragen dazu beantworten wir über [Kontakt](/kontakt). Praxen, die Rechnungen online bezahlen lassen wollen, können [Online-Zahlungen](/online-zahlungen) einbinden, mit TWINT und Karte, ohne dass Gesundheitsdaten über die Zahlung laufen.
