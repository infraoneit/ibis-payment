metaDescription: 'Zahlterminal für Arztpraxis, Zahnarzt und Physiotherapie: Anbindung an die Praxissoftware, PIN-Pad am Empfang, keine Gesundheitsdaten auf dem Terminal.'
kicker: Branche
lead: Ein Terminal am Empfang, das den Betrag aus der Praxissoftware übernimmt, diskret bedient wird und nichts über die Behandlung weiss.
intro: |
  In der Praxis wird nach der Behandlung bezahlt: der Selbstzahler-Anteil, die Zahnarztrechnung in Teilbeträgen, die Physiotherapie ohne Verordnung, die kosmetische Behandlung. Die Beträge sind höher als an einer Ladenkasse, und die Zahlung findet am Empfang statt, wo die nächsten Patientinnen und Patienten bereits warten.

  Das stellt drei Anforderungen. Der Betrag soll aus der Praxissoftware kommen, damit Debitorenliste und Kartenabrechnung übereinstimmen. Die Zahlung soll diskret ablaufen, mit einem PIN-Pad, das der Patient selbst bedient. Und das Terminal darf nichts über die Behandlung wissen, weder auf dem Display noch auf dem Beleg.

  Die Preisliste finden Sie unter [Konditionen](/konditionen), die Offerte über [Kontakt](/kontakt).
sections:
  - heading: Zahlen am Empfang, ohne Zuschauer
    body: |
      Die Behandlung ist abgeschlossen, die Praxissoftware erstellt die Rechnung. Wer direkt bezahlt, spart der Praxis Versand, Debitorenüberwachung und Mahnwesen. Der Betrag wird von der Software ans Terminal übergeben oder am Empfang eingetippt. Der Patient hält die Karte an das PIN-Pad, gibt bei höheren Beträgen die PIN ein, und der Beleg kommt aus dem Drucker, mit Praxisname, Betrag und Datum, ohne Angaben zur Leistung.

      Das PIN-Pad steht auf der Patientenseite. Der Patient bedient es selbst, das Personal sieht die PIN nicht, und die Karte wechselt nicht den Besitzer. In Zahnarztpraxen mit Teilzahlungen ist jede Teilzahlung eine eigene Kartenzahlung mit eigenem Beleg.
  - heading: CT20P mit Praxissoftware oder V3CT3 ohne Kasse
    body: |
      Für den Empfang mit Praxissoftware passt der [PayTec CT20P](/geraete/paytec-ct20p). Er ist kassenintegriert, hat ein physisches PIN-Pad mit 15 Tasten und fühlbaren Markierungen, das auch Menschen mit Sehbehinderung bedienen können, und hängt am LAN oder WLAN, auf Wunsch mit Strom über das Netzwerkkabel. Den Beleg druckt er über den Drucker, der am Empfang ohnehin steht. Ein Kensington-Schloss sichert ihn am Tresen. Miete CHF 24 pro Monat, Kauf CHF 590, exkl. MwSt.

      Für Praxen ohne anbindbare Software oder für den Zweitstandort reicht der [PayTec V3CT3](/geraete/paytec-v3ct3). Das Tischterminal hat Tastatur und eigenen Drucker, der Betrag wird eingetippt, optional mit dem Kunden-Pinpad P200 für die Patientenseite. Miete CHF 19 pro Monat, Kauf CHF 390, exkl. MwSt.

      Für Hausbesuche, Spitex und Therapeuten, die beim Patienten abrechnen, kommt der mobile [PayTec N62](/geraete/paytec-n62) mit 4G dazu. Alle Modelle stehen unter [Geräte](/geraete).
  - heading: Anbindung an die Praxissoftware über OPI, ZVT oder KIT
    body: |
      Die Anbindung übergibt den Rechnungsbetrag von der Praxissoftware ans Terminal. Niemand tippt ab, die Zahlung wird in der Software als beglichen verbucht, und die Debitorenliste stimmt mit der Kartenabrechnung überein. In der Schweiz laufen diese Anbindungen über die Protokolle OPI, ZVT oder KIT. Der CT20P unterstützt alle drei, KIT auch über die Cloud.

      Ob Ihre Praxissoftware eines der Protokolle unterstützt, klären wir vor der Installation mit dem Softwareanbieter. Die Installation vor Ort, inklusive Anbindung und Netzwerk, ist im Preis inbegriffen. Praxen, die zusätzlich ein Kassensystem für Produkte oder Selbstzahlerleistungen suchen, finden die Systeme unter [Kassensysteme](/kassensysteme).
  - heading: Datenschutz, das Terminal kennt nur den Betrag
    body: |
      Das Terminal verarbeitet den Betrag und die Kartendaten, sonst nichts. Bei der Anbindung übergibt die Praxissoftware nur den Betrag und eine Referenz, keine Patientendaten und keine Leistungen. Alle Modelle sind nach PCI PTS 6.x zertifiziert und ep2-zugelassen. Auf dem Beleg stehen Praxisname, Betrag, Datum und die üblichen Zahlungsangaben, keine Behandlung.

      Die Zahlungsdaten gehen über das SwiPay-Bezahlnetzwerk an den Acquirer TeleCash/Fiserv. Gesundheitsdaten bleiben in der Praxissoftware. Für die Datenschutzerklärung der Praxis heisst das: Über das Zahlungssystem laufen keine besonders schützenswerten Daten.
  - heading: Höhere Beträge und was das für die Gebühr heisst
    body: |
      Bei höheren Beträgen verliert der Fixbetrag pro Zahlung an Bedeutung; CHF 0.05 auf eine dreistellige Rechnung fallen kaum ins Gewicht. Entscheidend ist der Prozentsatz. Wird ein grosser Teil mit Kreditkarte bezahlt, prägt der Kreditsatz die Abrechnung. Bei uns kostet Debit Inland 0.75 %, Kredit Inland 1.25 %, TWINT 1.00 %, exkl. MwSt.

      Ausländische und Firmenkarten tragen einen Zuschlag von 0.90 Prozentpunkten, was in Praxen mit internationaler Kundschaft eine sichtbare Position ist. American Express schalten wir auf Wunsch zu 1.90 % frei. Es gibt keine Mindestgebühr und keine Aufschaltgebühr. Die Beispielrechnung unten zeigt, was eine Praxis mit den genannten Annahmen pro Monat zahlt, verglichen mit dem Listenpreis eines Grossanbieters.
  - heading: Montagmorgen, Ausfall, Abrechnung und Wechsel
    body: |
      Am Montagmorgen und nach den Ferien stehen die Patienten am Empfang Schlange. Ein zweites Terminal an einem zweiten Arbeitsplatz entlastet. Der CT20P hängt am Kabel, nicht am WLAN, was in Praxen mit dicken Wänden die zuverlässigere Variante ist. Bei einem Defekt schicken wir ein Ersatzgerät, in der Miete inbegriffen, und Ihr Berater ist über die Direktwahl erreichbar, siehe [Support](/support).

      Die Umsätze werden gesammelt pro Tag am nächsten Werktag gutgeschrieben. Einmal pro Monat erhalten Sie eine Abrechnung auf einer Seite. Wenn Sie heute schon ein Terminal haben, schicken Sie uns die letzte Abrechnung über [Kontakt](/kontakt). Wir vergleichen innert 24 Stunden und unterbieten sie, oder wir sagen Ihnen, dass es nicht geht. Alle Sätze stehen unter [Konditionen](/konditionen).
