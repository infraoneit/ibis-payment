faq:
  - frage: Lässt sich das Terminal an unsere Praxissoftware anbinden?
    antwort: |
      Wenn die Software OPI, ZVT oder KIT unterstützt, ja. Das klären wir vor der Installation mit Ihrem Softwareanbieter. Ohne Anbindung wird der Betrag am V3CT3 eingetippt.
  - frage: Sieht das Terminal, welche Behandlung bezahlt wird?
    antwort: |
      Nein. Übergeben werden nur Betrag und eine Referenz. Auf dem Beleg stehen Praxisname, Betrag und Datum. Gesundheitsdaten bleiben in der Praxissoftware.
  - frage: Kann der Patient die PIN eingeben, ohne dass das Personal zuschaut?
    antwort: |
      Ja. Der CT20P hat ein physisches PIN-Pad auf der Patientenseite, der V3CT3 bekommt auf Wunsch das Kunden-Pinpad P200. Die Karte bleibt in der Hand des Patienten.
  - frage: Was kosten Teilzahlungen bei einer Zahnarztrechnung?
    antwort: |
      Jede Teilzahlung ist eine eigene Kartenzahlung mit dem Satz der jeweiligen Karte plus CHF 0.05 Fixbetrag. Bei dreistelligen Beträgen ist der Fixbetrag vernachlässigbar, der Prozentsatz zählt.
  - frage: Nehmen wir auch Karten von Patienten aus dem Ausland an?
    antwort: |
      Ja. Ausländische und Firmenkarten tragen einen Zuschlag von 0.90 Prozentpunkten auf den jeweiligen Satz, exkl. MwSt. Die Position steht getrennt auf der Abrechnung.
