faq:
  - frage: Gibt es einen Zahlterminal-Anbieter, der für alle Betriebe günstiger ist?
    antwort: |
      Das hängt von Ihrem Durchschnittsbetrag und Kartenmix ab, darum gibt es keine allgemeine Antwort. Bei sehr kleinen Umsätzen kann ein App-Anbieter ohne Monatsgebühr vorne liegen, ab einigen tausend Franken Kartenumsatz pro Monat meist ein Terminal mit Vertrag. Rechnen Sie es mit Ihren Zahlen nach.
  - frage: Was bedeutet Interchange++ im Vergleich zu einem festen Satz?
    antwort: |
      Bei Interchange++ werden Interchange und Netzwerkgebühr durchgereicht, der Anbieter nennt nur seine Marge. Bei einem festen Satz, auch Blended genannt, ist alles in einem Prozentsatz enthalten. Vergleichbar werden beide erst, wenn Sie den Gesamtsatz pro Kartenart kennen.
  - frage: Warum ist der Fixbetrag pro Zahlung so wichtig?
    antwort: |
      Weil er bei kleinen Bons mehr ausmacht als der Prozentsatz. CHF 0.15 auf eine Zahlung von CHF 10 sind 1.5 %, CHF 0.05 sind 0.5 %. Ein Café oder eine Bäckerei sollte den Fixbetrag zuerst vergleichen.
  - frage: Darf ich meine heutige Abrechnung zum Vergleich weitergeben?
    antwort: |
      Ja, die Abrechnung gehört Ihnen. Wir nutzen sie nur für den Vergleich und löschen sie danach. Sie erhalten innert 24 Stunden dieselben Umsätze mit unseren Sätzen gerechnet.
  - frage: Wie oft sollte ich meine Terminalkonditionen prüfen?
    antwort: |
      Alle zwei Jahre, bei jeder Änderung der Interchange-Sätze und spätestens beim Terminalwechsel 2027. Verträge mit langer Laufzeit sollten Sie vor dem Verlängerungsdatum prüfen, sonst verlängern sie sich automatisch.
