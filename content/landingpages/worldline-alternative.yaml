faq:
  - frage: Kann ich mit laufendem Worldline-Vertrag wechseln?
    antwort: |
      Ja, aber erst auf das Ende der Kündigungsfrist. Wir prüfen Ihren Vertrag, übernehmen die Kündigung und legen die Installation auf den Stichtag. Läuft der Vertrag noch lange, rechnen wir vor, ob sich ein früherer Ausstieg lohnt.
  - frage: Was kostet der Wechsel von Worldline zu ibis payment?
    antwort: |
      Bei uns nichts: keine Aufschaltgebühr, Installation vor Ort inbegriffen. Was beim bisherigen Anbieter bei vorzeitiger Kündigung anfällt, steht in dessen Vertrag und ist Teil unserer Gegenrechnung.
  - frage: Kann ich mein Worldline-Terminal behalten?
    antwort: |
      In der Regel nicht, weil das Terminal an das Bezahlnetzwerk des Anbieters gebunden ist und oft gemietet ist. Sie erhalten ein Terminal von PayTec, zur Miete ab CHF 19 oder zum Kauf ab CHF 390, exkl. MwSt.
  - frage: Funktionieren TWINT und PostFinance Card nach dem Wechsel weiter?
    antwort: |
      Ja. Alle Terminals, die wir vermitteln, sind ep2-zertifiziert und wickeln TWINT direkt auf dem Terminal, PostFinance Card, Reka und Lunch-Check ab. Die Zahlungen erscheinen auf derselben Abrechnung wie Debit- und Kreditkarten.
  - frage: Wie erkenne ich, ob sich ein Wechsel lohnt?
    antwort: |
      Schicken Sie uns Ihre letzte Monatsabrechnung. Sie erhalten innert 24 Stunden dieselben Umsätze mit unseren Sätzen gerechnet, Position für Position. Liegt unser Angebot nicht unter Ihrer heutigen Abrechnung, sagen wir Ihnen das.
  - frage: Bleibt meine Kasse angebunden?
    antwort: |
      Ja, wenn Ihre Kasse OPI, ZVT oder KIT spricht, was bei den meisten Schweizer Kassensystemen der Fall ist. Die Anbindung ist Teil der Installation vor Ort. Details unter [Kassensysteme](/kassensysteme).
