name: PayTec N96
hersteller: PayTec
kategorie: mobil
reihenfolge: 3
featured: true
kurz: Das grosse mobile Terminal mit 6.5-Zoll-Display, Drucker und 18 Tagen Standby.
beschreibung: 'Der N96 ist das Flaggschiff der mobilen Reihe: ein 6.5-Zoll-HD-Display mit schmalem Rand, ein schneller Thermodrucker (80 mm pro Sekunde) und ein 3050-mAh-Akku, der laut Datenblatt über 1500 Belege pro Ladung druckt. Dank Qualcomm-Prozessor und Android 11 reagiert das Gerät ohne Wartezeit, auch bei Trinkgeld-Eingabe und Belegsplitting am Tisch.


  Zwei Kameras lesen QR-Codes und Barcodes, die Papierrolle wird ohne Werkzeug gewechselt. Belege lassen sich mit Ihrem Logo bedrucken.'
einsatz:
- Restaurant, Hotel, Bar
- Event und Festival
- Detailhandel mit Beratung am Regal
- Mobile Dienstleister
