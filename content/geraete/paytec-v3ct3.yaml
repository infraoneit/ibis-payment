name: PayTec V3CT3
hersteller: PayTec
kategorie: stationaer
reihenfolge: 5
featured: false
kurz: Das klassische Tischterminal mit eigenem Drucker, für Betriebe ohne Kassensystem.
beschreibung: 'Der V3CT3 ist das Terminal für alle, die keine Kasse anbinden, aber einen gedruckten Beleg wollen: Tastatur, Drucker und Kartenleser in einem Gehäuse, per LAN oder WLAN verbunden. Betrag eintippen, Karte vorhalten, Beleg abreissen.


  Für Bäckereien, Metzgereien und Take-aways gibt es das Zusatz-Pinpad P200 für die Kundenseite, damit der Kunde am Tresen selbst bezahlt, ohne dass das Terminal über die Theke wandert.'
einsatz:
- Bäckerei, Metzgerei, Take-away
- Blumenladen, Kiosk
- Praxis ohne Kassensystem
- Vereine und Verkaufsstellen
