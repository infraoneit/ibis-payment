kurz: Das kompakte Terminal für die Hosentasche, mit 4G und WLAN, ohne Drucker.
beschreibung: >-
  Der N62 ist das kleinste Terminal im Sortiment: kaum grösser als ein Kartenstapel, 176 Gramm, mit Touchscreen und Akku für den ganzen Tag. Der Beleg geht digital raus, per QR-Code auf dem Display, per SMS oder E-Mail. Damit entfällt die Papierrolle, und das Terminal passt in jede Schürze.


  Verbunden ist der N62 über 4G oder WLAN und wechselt automatisch, wenn eines ausfällt. Karten und Handys werden kontaktlos gelesen, Chipkarten über den Schlitz. Mehr als 550 Zahlungen pro Akkuladung reichen für einen langen Markttag.
einsatz:
  - Service am Tisch
