name: PayTec CT20P
hersteller: PayTec
kategorie: kassenintegriert
reihenfolge: 4
featured: true
kurz: Das stationäre Terminal für den Kassenplatz, mit physischem PIN-Pad und Kassenanbindung.
beschreibung: 'Der CT20P steht am Kassenplatz und spricht mit Ihrer Kasse: Der Betrag wird von der Kasse ans Terminal übergeben, niemand tippt ihn ab. Das physische PIN-Pad mit 15 Tasten und fühlbaren Punkten ist auch für Menschen mit Sehbehinderung bedienbar, was im Detailhandel zunehmend verlangt wird.


  Angebunden wird das Gerät per LAN oder WLAN, auf Wunsch mit Strom über das Netzwerkkabel (PoE). Ein Kensington-Schloss sichert es am Tresen. Für den Beleg nutzt der CT20P den Drucker Ihrer Kasse.'
