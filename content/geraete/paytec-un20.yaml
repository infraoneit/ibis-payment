name: PayTec UN20
hersteller: PayTec
kategorie: automat
reihenfolge: 6
featured: true
kurz: Das Einbauterminal für Automaten, Parking und Ladestationen, wetterfest und rund um die Uhr im Einsatz.
beschreibung: 'Der UN20 wird in den Automaten eingebaut und läuft ohne Personal: IP65 gegen Staub und Strahlwasser, IK10 gegen Schläge, Betrieb von minus 20 bis plus 70 Grad. Das 5-Zoll-Display lässt sich mit Handschuhen bedienen.


  Angebunden wird das Terminal über MDB, RS232, LAN oder 4G an die Automatensteuerung; Fernwartung und automatische Updates sind Standard. Einbau und Anbindung unterscheiden sich je nach Automat, darum offerieren wir Automaten-Projekte einzeln.'
einsatz:
- Verkaufs- und Getränkeautomaten
- Parking und Ticketing
- Waschanlagen und Waschsalons
- Ladestationen für Elektrofahrzeuge
- Self-Service-Kioske
