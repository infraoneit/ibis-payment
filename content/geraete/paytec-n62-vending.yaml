kurz: Die Automaten-Variante des N62 für Verkaufsautomaten mit wenig Platz.
beschreibung: 'Der N62 Vending bringt den kompakten N62 in Automaten, in denen ein grosses Einbauterminal keinen Platz hat: Getränke- und Snackautomaten, Kaffeeautomaten im Büro, Selbstbedienungs-Kühlschränke. Kontaktlos bezahlen mit Karte oder Handy, Anbindung an die Automatensteuerung, Betrieb ohne Personal.


  Ob N62 Vending oder UN20 besser passt, hängt vom Automaten, vom Standort (innen oder aussen) und von der Steuerung ab. Das klären wir vor Ort.'
