kurz: Mobiles Terminal mit Drucker und grossem Akku, für lange Schichten und raue Umgebungen.
beschreibung: >-
  Der N86 ist das Arbeitstier unter den mobilen Terminals: 5.5-Zoll-Display, integrierter Thermodrucker und ein Akku, der laut Hersteller über 600 Belege pro Ladung schafft. Das Gehäuse übersteht Stürze aus 1.5 Metern auf Stein und ist für den Einsatz in anspruchsvollen Umgebungen ausgelegt.


  Der Barcode-Scanner liest auch verschmutzte oder beschädigte Codes, was ihn für Lieferdienste und Lager interessant macht. 4G und WLAN wechseln automatisch.
einsatz:
  - Restaurant mit Service am Tisch
  - Lieferdienst und Kurier
  - Bau und Werkstatt
  - Event und Festival
