frage: Terminal kaufen oder mieten?
antwort: Beides ist möglich. In der Miete sind Wartung, Updates und der Austausch bei Defekt inbegriffen. Beim Kauf gehört das Terminal Ihnen, mit Herstellergarantie [Dauer bestätigen]. Als Faustregel lohnt sich der Kauf ab etwa zwei Jahren Nutzung; wir rechnen es Ihnen mit Ihren Zahlen vor.
bereich: konditionen
