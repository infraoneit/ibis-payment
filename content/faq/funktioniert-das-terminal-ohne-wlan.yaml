frage: Funktioniert das Terminal ohne WLAN?
antwort: Ja. Die mobilen Terminals haben eine SIM-Karte für 4G und wechseln automatisch, wenn das WLAN ausfällt. Stationäre Geräte laufen über das Netzwerkkabel. Für Keller und Hinterhöfe prüfen wir den Empfang bei der Installation.
