frage: Was braucht es für das Handy als Terminal?
antwort: Ein Android- oder iOS-Smartphone mit NFC, die App und einen Vertrag. Es gibt keine Hardware und keine Fixkosten. Akzeptiert werden Visa, Mastercard und American Express (Debit und Kredit), Apple Pay und Google Pay. TWINT und PostFinance Card laufen nicht über das Handy; dafür braucht es ein Terminal.
