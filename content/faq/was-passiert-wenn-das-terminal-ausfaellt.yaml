frage: Was passiert, wenn das Terminal ausfällt?
antwort: Sie rufen Ihren Berater an. Lässt sich das Problem nicht aus der Ferne lösen, erhalten Sie ein Ersatzgerät. Zur Überbrückung richten wir Ihnen das Handy als Terminal ein, damit Sie weiter Karten annehmen können.
