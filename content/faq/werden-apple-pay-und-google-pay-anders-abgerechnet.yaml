frage: Werden Apple Pay und Google Pay anders abgerechnet?
antwort: Nein. Eine Zahlung mit dem Handy ist eine Zahlung mit der hinterlegten Karte. Ist eine Debitkarte hinterlegt, gilt der Debitsatz, bei einer Kreditkarte der Kreditsatz. Einen Zuschlag für Wallets gibt es nicht.
bereich: konditionen
