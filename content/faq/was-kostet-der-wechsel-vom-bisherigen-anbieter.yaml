frage: Was kostet der Wechsel vom bisherigen Anbieter?
antwort: Bei uns nichts. Wir prüfen Ihre Kündigungsfrist, übernehmen die Kündigung und installieren am Stichtag. Läuft Ihr alter Vertrag noch lange, rechnen wir Ihnen vor, ob sich ein früherer Ausstieg trotz Restlaufzeit lohnt.
