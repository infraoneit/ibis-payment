frage: Welches Terminal passt zu meinem Betrieb?
antwort: Wer am Tisch oder unterwegs kassiert, braucht ein mobiles Terminal mit Akku (N62 ohne, N96 mit Drucker). Wer eine Kasse hat, nimmt ein kassenintegriertes Gerät (CT20P), damit der Betrag nicht abgetippt wird. Wer ohne Kasse am Tresen kassiert, nimmt das Tischterminal mit Drucker (V3CT3). Automaten bekommen ein Einbauterminal (UN20). Wir schauen es uns vor Ort an.
bereich: geraete
reihenfolge: 2
