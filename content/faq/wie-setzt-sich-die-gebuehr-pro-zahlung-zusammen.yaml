frage: Wie setzt sich die Gebühr pro Zahlung zusammen?
antwort: 'Aus drei Teilen: der Interchange-Gebühr an die Bank des Karteninhabers (in der Schweiz durch Einigungen der WEKO mit Mastercard und Visa geregelt, bei Inland-Debitkarten am Verkaufspunkt maximal 0.12 bis 0.20 %, bei Kreditkarten 0.44 %), der Gebühr an das Kartennetzwerk und unserer Marge für Abwicklung, Terminal und Service. Alle drei Anteile weisen wir in der Offerte aus.'
