frage: Welche Kassensysteme können angebunden werden?
antwort: Alle Kassen, die eines der Schweizer Standardprotokolle OPI, ZVT oder KIT sprechen. Das sind die meisten Gastro- und Detailhandelskassen. Haben Sie noch keine Kasse, liefern wir Kasse und Terminal aus einer Hand und richten beides ein.
