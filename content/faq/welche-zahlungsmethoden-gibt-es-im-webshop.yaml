frage: Welche Zahlungsmethoden gibt es im Webshop?
antwort: Über das Zahlungs-Gateway unseres Partners stehen über 40 Methoden bereit, darunter TWINT, PostFinance, Kredit- und Debitkarten, Apple Pay und Google Pay sowie Rechnung. Für die gängigen Shop-Systeme gibt es fertige Plugins. Laden und Webshop erscheinen auf einer Abrechnung.
